name: Sonde UCI
on:
  push:
    branches: ['ccr-*']
    paths:
      - 'tools/sondes/sonde_uci.py'
      - '.github/workflows/sonde_uci.yml'
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u tools/sondes/sonde_uci.py
