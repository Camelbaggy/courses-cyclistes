name: Veille update (relance des passages sautés)

# GitHub retarde ou abandonne souvent les déclenchements programmés (crons) d'update.yml ('17 13-22 * * *' et '41 6 * * *').
# Ce workflow, déclenché à :52 de chaque heure, relance update.yml quand son passage a été sauté :
#   - entre 13 h et 23 h UTC (créneau des courses) : si le dernier passage date d'au moins 50 min. À :52, un passage de :17 qui
#     a eu lieu date d'environ 35 min (pas de relance) ; s'il a été sauté, le dernier date d'au moins ~60 min (relance).
#     Une relance de la veille à :52 compte comme un passage : la suivante n'a lieu qu'une heure plus tard au plus tôt ;
#   - entre 7 h et 9 h UTC (heures 7 et 8) : si le dernier passage date d'au moins 3 h (rattrapage du cron matinal de 6 h 41) ;
#   - hors de ces créneaux : rien.
# Rien n'est relancé si un passage d'update.yml est en file ou en cours. Aucun accès aux données : lecture de la liste des
# exécutions et déclenchement seulement (jeton du dépôt).
# Les contrôles sont dans .github/scripts/veille_update.sh, partagé avec battement.yml (qui les exécute toutes les 10 min : ce
# cron n'est que le secours). En plus : relance battement.yml s'il n'est ni en file ni en cours.
on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: veille-update
  cancel-in-progress: true

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout des scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Relance d'update.yml si son passage a été sauté
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/veille_update.sh
      - name: Relance du battement s'il ne tourne pas
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/relance_battement.sh
