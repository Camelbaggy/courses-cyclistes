name: Battement (veille auto-entretenue)

# GitHub saute la plupart des crons, mais jamais les workflow_dispatch. Ce workflow est donc un « battement » : un job de ~330 min
# qui, toutes les 10 min, exécute les contrôles de veille_update.yml (.github/scripts/veille_update.sh : relance update.yml
# s'il a été sauté, seuil 50 min entre 13 h et 23 h UTC, 180 min entre 7 h et 9 h, sinon rien).
# Au bout de ~330 min, il se relance lui-même (workflow_dispatch) puis se termine ; la concurrence (groupe battement, sans
# annulation) place le suivant en attente jusqu'à la fin de celui-ci. Un autre battement déjà en cours à l'arrivée : sortie.
# Secours : veille_update.yml (cron) relance battement.yml s'il n'est ni en file ni en cours. Lecture de la liste des
# exécutions et déclenchements seulement (jeton du dépôt).
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: battement
  cancel-in-progress: false

jobs:
  battement:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout des scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Battement
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/battement.sh
