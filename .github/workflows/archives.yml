name: Archives (saisons passées)

# Collecte des saisons passées dans data/archives/ (docs/PLAN_ARCHIVES.md) et rotation N / N-1 (les saisons < N-1 quittent data/ pour data/archives/). Passages nocturnes, hors des créneaux de
# update.yml ; chaque passage reprend où le précédent s'est arrêté (budget de temps) et une saison complète n'est
# plus jamais recollectée. Saisons : entrée manuelle, sinon variable de dépôt ARCHIVES_SAISONS, sinon 2021-2025.
# Le cron (que GitHub saute ou retarde souvent) n'est qu'une amorce : après le commit, le workflow se relance lui-même
# tant qu'une saison demandée n'est pas complète, sauf entre 11 h et 23 h UTC (ne pas bloquer update.yml, même
# groupe de concurrence, 13 h-22 h UTC) et si le passage n'a rien changé (pas de boucle sans progrès).
on:
  schedule:
    - cron: '23 0-5 * * *'
  workflow_dispatch:
    inputs:
      saisons:
        description: "Saisons (« 2021-2025 », « 2023 », « 2021,2023 » ; vide = variable ARCHIVES_SAISONS ou 2021-2025)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # relance du workflow (gh workflow run)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  archives:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collecte des archives
        env:
          PYTHONUNBUFFERED: "1"
          AI_BUDGET_SECONDS: "0"
          SAISONS_ENTREE: ${{ inputs.saisons }}
          SAISONS_VAR: ${{ vars.ARCHIVES_SAISONS }}
        run: |
          SAISONS="${SAISONS_ENTREE:-${SAISONS_VAR:-2021-2025}}"
          echo "Saisons : $SAISONS"
          echo "SAISONS=$SAISONS" >> "$GITHUB_ENV"
          python run_pipeline.py --archive "$SAISONS" --budget-min 50
      - name: Commit des archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/   # inclut les suppressions de la rotation N / N-1
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          echo "CHANGED=1" >> "$GITHUB_ENV"
          git commit -m "chore: archives ${SAISONS}"
          # si un autre passage a commité entre-temps (update.yml : data/ hors archives), pas de conflit attendu
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Relance si des saisons restent à collecter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INCOMPLETES=$(python -c "
          import json, os, sys
          from run_pipeline import parse_saisons
          reste = []
          for a in parse_saisons(sys.argv[1]):
              try:
                  with open(os.path.join('data', 'archives', str(a), 'state.json'), encoding='utf-8') as f:
                      complete = bool(json.load(f).get('complete'))
              except (OSError, ValueError):
                  complete = False
              if not complete:
                  reste.append(a)
          print(','.join(str(a) for a in reste))
          " "$SAISONS")
          HEURE=$(date -u +%H)
          if [ -z "$INCOMPLETES" ]; then
            echo "pas de relance : toutes les saisons demandées ($SAISONS) sont complètes"
          elif [ "$CHANGED" != "1" ]; then
            echo "pas de relance : saisons incomplètes [$INCOMPLETES] mais ce passage n'a rien changé (pas de progrès)"
          elif [ "$((10#$HEURE))" -ge 11 ] && [ "$((10#$HEURE))" -lt 23 ]; then
            echo "pas de relance : saisons incomplètes [$INCOMPLETES] mais il est ${HEURE} h UTC (créneau d'update.yml, 11 h-23 h) ; le cron reprendra"
          else
            echo "relance : saisons incomplètes [$INCOMPLETES] (${HEURE} h UTC)"
            gh workflow run archives.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f saisons="$SAISONS"
          fi
