<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Courses cyclistes</title>
<meta name="description" content="Encyclopédie du cyclisme sur route : résultats, calendrier, classements, coureurs et courses.">
<style>
/* ---------- jetons de design (thème sombre unique) ----------
   fond / surfaces étagées / bordure / texte ; une couleur d'accent ; catégories ; maillots ; espacements 4-8-12-16-24-32 ; rayons 8 / 14 */
:root {
  --bg: #0a0e15;       /* fond de page */
  --s1: #111722;       /* surface : cartes */
  --s2: #18202e;       /* surface relevée : en-têtes de tableau, puces, champs */
  --s3: #222c3e;       /* surface active / survol */
  --line: #2a3548;     /* bordures */
  --tx: #f1f4f9;       /* texte principal (contraste AA sur toutes les surfaces) */
  --tx2: #b3bfd3;      /* texte secondaire */
  --tx3: #93a1b8;      /* texte atténué (≥ 5,5:1 sur --s1) */
  --accent: #6aa9ff;
  --accent-soft: rgba(106, 169, 255, .16);
  --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  /* catégories de course (texte blanc, contraste ≥ 5:1) */
  --c-wt: #1d4ed8; --c-pro: #7c3aed; --c-fdj: #2563eb; --c-1: #0f766e; --c-2: #b45309; --c-ch: #be185d;
  /* maillots / médailles */
  --jaune: #facc15; --vert: #22c55e; --blanc: #f8fafc; --pois: #ef4444; --argent: #cbd5e1; --bronze: #d6945a;
  /* espacements, rayons, ombres */
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px; --sp6: 32px;
  --r1: 8px; --r2: 14px;
  --sh1: 0 1px 2px rgba(0, 0, 0, .35); --sh2: 0 8px 24px rgba(0, 0, 0, .45);
  --bar-h: 56px;       /* hauteur de l'en-tête (onglets collants dessous) */
  --bnav-h: 58px;      /* hauteur de la barre de navigation du bas (mobile) */
  /* noms historiques conservés (pages existantes) */
  --card: var(--s1); --elev: var(--s2); --border: var(--line); --text: var(--tx); --muted: var(--tx3);
  --fr: var(--accent); --fr-bg: rgba(106, 169, 255, .12); --shadow: var(--sh1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { color-scheme: dark; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.45; font-size: 15px;
  overflow-x: hidden; padding-bottom: calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px) + 12px);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.muted { color: var(--muted); }
.small { font-size: .78rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- en-tête, menu principal, barre du bas ---------- */
header.top {
  position: sticky; top: 0; z-index: 30; height: var(--bar-h);
  background: rgba(10, 14, 21, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1040px; margin: 0 auto; height: 100%; padding: 0 var(--sp4); display: flex; align-items: center; gap: var(--sp3); }
.brand { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; color: var(--tx); text-decoration: none; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.dnav { display: none; gap: 2px; margin-left: var(--sp3); }
.dnav a { padding: 8px 14px; border-radius: 99px; font-weight: 600; font-size: .9rem; color: var(--tx2); text-decoration: none; }
.dnav a:hover { background: var(--s2); color: var(--tx); }
.dnav a.on { color: var(--accent); background: var(--accent-soft); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: var(--sp1); min-width: 0; }
#maj { font-size: .7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--s1); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: var(--bnav-h); padding: 6px 2px;
  font-size: .68rem; font-weight: 600; color: var(--tx3); text-decoration: none; }
.bnav a svg { width: 24px; height: 24px; }
.bnav a.on { color: var(--accent); }
.bnav a:focus-visible, .dnav a:focus-visible, .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
main { max-width: 1040px; margin: 0 auto; padding: var(--sp4) var(--sp4) var(--sp5); min-height: 70vh; }
.pg { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp3); }
.stack { display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 880px) {
  body { padding-bottom: 40px; }
  .dnav { display: flex; }
  .bnav { display: none; }
  main { padding-top: var(--sp5); }
}
@media (max-width: 400px) { #maj { display: none; } }

/* ---------- cartes ---------- */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r2); padding: 12px 14px;
  box-shadow: var(--shadow);
}
.card.click { cursor: pointer; width: 100%; text-align: left; display: block; }
.card.click:active { background: var(--elev); }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.race-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.card-label { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
.winner-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.winner-line .who { min-width: 0; }
.winner-line .nm { font-weight: 600; overflow-wrap: anywhere; }
.pill-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); width: 88px; flex: none; white-space: nowrap; }
.summary { margin-top: 10px; font-size: .9rem; line-height: 1.5; padding-top: 10px; border-top: 1px dashed var(--border); }
.badge {
  display: inline-block; font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 99px;
  background: var(--elev); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
}
.badge.cat-WT { color: #fff; background: var(--c-wt); border-color: var(--c-wt); }
.badge.cat-Pro { color: #fff; background: var(--c-pro); border-color: var(--c-pro); }
.badge.cat-FDJ { color: #fff; background: var(--c-fdj); border-color: var(--c-fdj); }
.badge.cat-1 { color: #fff; background: var(--c-1); border-color: var(--c-1); }
.badge.cat-2 { color: #fff; background: var(--c-2); border-color: var(--c-2); }
.badge.cat-Champ { color: #fff; background: var(--c-ch); border-color: var(--c-ch); }
.badge.live { color: var(--ok); border-color: var(--ok); background: transparent; }
.badge.fr { color: var(--fr); border-color: var(--fr); background: var(--fr-bg); }
.flag { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; flex: none; background: var(--elev); vertical-align: -2px; }
.flag.noimg { visibility: hidden; }

/* ---------- filtres / chips ---------- */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font-size: .8rem; font-weight: 600; padding: 6px 12px; border-radius: 99px;
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.stage-chip { border-radius: 10px; padding: 4px 11px; text-align: center; line-height: 1.2; min-width: 52px; }
.stage-chip b { display: block; font-size: .85rem; }
.stage-chip span { display: block; font-size: .65rem; opacity: .85; font-weight: 500; }

/* ---------- calendrier ---------- */
.month { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
.cal-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; }
.cal-date { flex: none; width: 66px; font-size: .78rem; color: var(--muted); font-weight: 600; line-height: 1.25; }
.cal-main { min-width: 0; flex: 1; }
.cal-item.future { opacity: .55; }
.cal-item.future .race-name { font-weight: 600; }

/* ---------- tableaux ---------- */
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 30px 22px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  padding: 7px 8px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent;
}
.row:last-child { border-bottom: none; }
.row.fr { background: var(--fr-bg); border-left-color: var(--fr); }
.row .rk { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: .85rem; }
.row .rk small { display: block; font-size: .62rem; font-weight: 700; line-height: 1; margin-top: 1px; }
.up { color: var(--ok); } .down { color: var(--bad); }
.row .nm { font-weight: 600; font-size: .88rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tm { font-size: .72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mid { min-width: 0; }
.row .val { text-align: right; font-variant-numeric: tabular-nums; font-size: .85rem; font-weight: 600; white-space: nowrap; }
.row .val small { display: block; font-size: .65rem; font-weight: 500; color: var(--muted); }
.row .val.first { color: var(--text); }
.row .val.gap { color: var(--muted); }
.table-card { padding: 0; overflow: hidden; }
.table-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 600; }
.switch i { width: 34px; height: 20px; border-radius: 99px; background: var(--border); position: relative; transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-pressed="true"] i { background: var(--accent); }
.switch[aria-pressed="true"] i::after { transform: translateX(14px); }
.more { display: block; width: 100%; padding: 10px; font-weight: 600; font-size: .85rem; color: var(--accent); border-top: 1px solid var(--border); }
.group-title { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 12px 4px; background: var(--elev); }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: .9rem; }
.errbox { border: 1px solid var(--bad); color: var(--bad); border-radius: 12px; padding: 14px; text-align: center; background: var(--card); }
.errbox button { margin-top: 8px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--bad); font-weight: 600; color: var(--bad); }

/* ---------- fiche course ---------- */
.stage-head h2 { font-size: 1.05rem; line-height: 1.25; }
.stage-head .sub { color: var(--muted); font-size: .82rem; margin-top: 2px; }
.jerseys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jersey { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; min-width: 0; }
.jersey .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 1px solid rgba(0, 0, 0, .25); }
.dot.jaune { background: var(--jaune); } .dot.vert { background: var(--vert); }
.dot.blanc { background: var(--blanc); }
.dot.pois { background: radial-gradient(circle, var(--pois) 0 2.2px, transparent 2.6px) 0 0 / 7px 7px, #fff; }
.jersey .t { min-width: 0; line-height: 1.2; }
.jersey .t small { display: block; font-size: .62rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.jersey .t span { display: block; font-size: .8rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.sec-title { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.ai-tag { font-size: .65rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 99px; margin-left: 6px; text-transform: none; letter-spacing: 0; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.stat { background: var(--elev); border-radius: 8px; padding: 6px 10px; flex: 1 1 0; min-width: 78px; }
.stat b { display: block; font-size: 1rem; }
.stat span { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.poi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: .84rem; }
.poi .a { font-weight: 600; overflow-wrap: anywhere; }
.poi .b { color: var(--muted); font-size: .74rem; }
.poi .r { text-align: right; font-size: .76rem; color: var(--muted); white-space: nowrap; }
.cat { display: inline-block; font-size: .65rem; font-weight: 800; border-radius: 4px; padding: 0 5px; margin-right: 6px; background: var(--pois); color: #fff; }
.cat.c4 { background: #64748b; } .cat.c3 { background: #0ea5e9; } .cat.c2 { background: #f59e0b; } .cat.c1 { background: #ea580c; }
.cat.hc { background: #111827; }
.hl { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; font-size: .85rem; border-top: 1px solid var(--border); }
.hl:first-of-type { border-top: none; }
.hl .l { display: flex; gap: 8px; align-items: center; min-width: 0; }
.hl .l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl .r { color: var(--muted); font-size: .76rem; text-align: right; flex: none; }
.subtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.subtabs::-webkit-scrollbar { display: none; }
.subtab { flex: none; padding: 9px 10px; font-size: .82rem; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; }
.subtab.active { color: var(--accent); border-bottom-color: var(--accent); }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.loading::before { content: ""; display: block; width: 24px; height: 24px; margin: 0 auto 10px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.fixture-banner { background: var(--warn); color: #000; font-size: .7rem; font-weight: 700; text-align: center; padding: 2px 8px; }
a { color: var(--accent); }

/* ---------- fiche coureur ---------- */
.rlink { cursor: pointer; border-bottom: 1px dotted var(--muted); }
.rlink:hover, .rlink:focus-visible { color: var(--accent); border-bottom-color: var(--accent); outline: none; }
.rhead { display: flex; align-items: center; gap: 12px; }
.rhead .flag { width: 32px; height: 22px; }
.rhead h2 { font-size: 1.2rem; line-height: 1.2; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile.wide { grid-column: 1 / -1; }
.tile small { display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tile b { display: block; font-size: 1.5rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile b.off { font-size: 1.05rem; color: var(--muted); font-weight: 600; padding: 4px 0; }
.tile .sub { font-size: .74rem; color: var(--muted); }
.pal-group { padding: 0; overflow: hidden; }
.pal-head { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 12px; background: var(--elev); font-weight: 700; font-size: .88rem; }
.pal-head span.n { overflow-wrap: anywhere; min-width: 0; flex: 1; }
.pal-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 44px; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 8px 12px; border-top: 1px solid var(--border); font-size: .85rem; }
.pal-row:active, .pal-head:active { background: var(--elev); }
.pal-row .d { color: var(--muted); font-size: .74rem; }
.pal-row .l { min-width: 0; overflow-wrap: anywhere; }
.pal-row .k { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 2px 0; background: var(--elev); }
.pal-row .k.r1 { background: var(--jaune); color: #111827; }
.pal-row .k.r2 { background: #cbd5e1; color: #111827; }
.pal-row .k.r3 { background: #d6945a; color: #111827; }

/* ---------- classements / Français ---------- */
.clsubs { margin-bottom: 10px; }
.uc-tools { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.uc-tools .l1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.search { width: 100%; background: var(--elev); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; font-size: .9rem; padding: 7px 10px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row.uc { grid-template-columns: 40px 22px minmax(0, 1fr) auto; }
.row .rk .mv { display: block; font-size: .62rem; font-weight: 700; line-height: 1; margin-top: 1px; color: var(--muted); }
.cc { display: inline-block; width: 22px; text-align: center; font-size: .6rem; font-weight: 700; color: var(--muted); }
.fr-card { display: block; width: 100%; text-align: left; }
.fr-top { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; }
.fr-uci { text-align: center; line-height: 1.1; }
.fr-uci b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.fr-uci span { font-size: .62rem; color: var(--muted); }
.fr-top .nm { font-weight: 700; overflow-wrap: anywhere; }
.best { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0 0; margin-top: 6px; border-top: 1px dashed var(--border); font-size: .82rem; }
.best + .best { margin-top: 0; }
.best .medal { text-align: center; font-size: 1.1rem; line-height: 1; }
.best .pastille { display: inline-block; min-width: 28px; text-align: center; font-size: .72rem; font-weight: 800; border-radius: 99px; background: var(--elev); padding: 2px 6px; }
.best .t { min-width: 0; overflow-wrap: anywhere; }
.best .pt { font-size: .68rem; color: var(--muted); white-space: nowrap; }
details.nc { margin-top: 12px; }
details.nc summary { cursor: pointer; font-size: .8rem; font-weight: 700; color: var(--muted); padding: 8px 2px; }
.sel { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font: inherit; font-size: .95rem; font-weight: 600; padding: 9px 12px; }
.sel:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.badge[title] { cursor: help; }
.wins-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; width: 100%; text-align: left; padding: 8px 12px; border-top: 1px solid var(--border); font-size: .84rem; }
.wins-row:first-child { border-top: none; }
.wins-row:active { background: var(--elev); }
.wins-row .d { color: var(--muted); font-size: .74rem; }
.wins-row .l { min-width: 0; overflow-wrap: anywhere; }
.wins-row .l small { display: block; color: var(--muted); font-size: .74rem; }
.rtabs { margin: 0 -2px; }
.car-row { display: grid; grid-template-columns: 50px minmax(0, 1fr) 22px 26px 28px 28px 38px; gap: 5px; align-items: center; width: 100%; padding: 8px 10px; font-size: .78rem; text-align: left; }
.car-row > span { min-width: 0; overflow-wrap: anywhere; }
.car-row .n { text-align: center; font-variant-numeric: tabular-nums; }
.car-h { font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: var(--elev); }
.car-h .n { overflow-wrap: normal; }
.car-s { border-top: 1px solid var(--border); }
.car-s:first-of-type { border-top: none; }
.car-s > summary { list-style: none; cursor: pointer; }
.car-s > summary::-webkit-details-marker { display: none; }
.car-s > summary:active { background: var(--elev); }
.car-s .y { font-weight: 800; font-variant-numeric: tabular-nums; }
.car-s[open] .chev { transform: rotate(90deg); }
.chev { display: inline-block; width: 10px; color: var(--muted); transition: transform .15s; }
.car-s .pal-row { padding-left: 14px; }
.car-s .pal-row .l small { display: block; color: var(--muted); font-size: .74rem; }
.car-pal { background: var(--bg); }
.arch-note { font-size: .8rem; color: var(--warn); border: 1px solid var(--warn); border-radius: 10px; padding: 7px 10px; }
footer { text-align: center; color: var(--muted); font-size: .7rem; padding: 6px 16px 20px; }

/* ================== composants réutilisables (E2) ================== */
.tnum, .tbl, .row .val { font-variant-numeric: tabular-nums; }
h1.h-title { font-size: 1.55rem; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; overflow-wrap: anywhere; }
h2.h-sec { font-size: 1.05rem; font-weight: 700; margin: 0 0 var(--sp2); }
.btn-ico { width: 40px; height: 40px; border-radius: var(--r1); display: inline-flex; align-items: center; justify-content: center; color: var(--tx2); flex: none; }
.btn-ico:active, .btn-ico:hover { background: var(--s2); color: var(--tx); }
.btn-ico svg { width: 22px; height: 22px; }
.btn-ico:focus-visible, .subtab:focus-visible, .chip:focus-visible, .more:focus-visible, .crow:focus-visible, .mini:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* en-tête de fiche (« hero ») */
.hero { background: linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid var(--line); border-radius: var(--r2); padding: var(--sp4); box-shadow: var(--sh1); }
.hero-top { display: flex; gap: var(--sp4); align-items: center; }
.hero-photo { position: relative; width: 84px; height: 84px; border-radius: 50%; flex: none; overflow: hidden; background: var(--s3); border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.6rem; color: var(--tx3); letter-spacing: .02em; }
.hero-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-photo img.noimg { display: none; }
.hero-id { min-width: 0; }
.hero-sub { display: flex; align-items: center; gap: var(--sp2); color: var(--tx2); font-size: .88rem; margin-top: var(--sp1); flex-wrap: wrap; }
.hero-sub .flag { width: 22px; height: 15px; }
.hero-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--sp3); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--s3); color: var(--tx2); border: 1px solid var(--line); }
.pill.fr { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.credit { font-size: .68rem; color: var(--tx3); margin-top: var(--sp2); line-height: 1.3; }
.credit a { color: var(--tx2); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px var(--sp3); margin-top: var(--sp3); padding-top: var(--sp3); border-top: 1px solid var(--line); font-size: .86rem; }
.facts dt { color: var(--tx3); }
.facts dd { font-weight: 600; text-align: right; overflow-wrap: anywhere; }

/* tuiles de chiffres clés */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp2); }
.kpis .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile { border-radius: var(--r2); box-shadow: var(--sh1); }
.tile b { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
.tile b.txt { font-size: 1.05rem; line-height: 1.25; letter-spacing: 0; overflow-wrap: anywhere; padding: 3px 0; }

/* onglets de sous-pages : défilables et collants */
.subtabs.sticky { position: sticky; top: var(--bar-h); z-index: 4; background: var(--bg); margin: 0 calc(var(--sp4) * -1); padding: 0 var(--sp4); }
.subtabs.sticky::after { content: ""; flex: none; width: 1px; }

/* tableaux compacts, défilement horizontal, première colonne figée */
.tbl-wrap { overflow-x: auto; border-radius: var(--r2); border: 1px solid var(--line); background: var(--s1); }
table.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .84rem; }
.tbl th, .tbl td { padding: 9px 10px; white-space: nowrap; text-align: right; border-bottom: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: none; }
.tbl th { font-size: .66rem; text-transform: uppercase; letter-spacing: .04em; color: var(--tx3); background: var(--s2); font-weight: 700; }
.tbl th:first-child, .tbl td:first-child { position: sticky; left: 0; text-align: left; background: var(--s1); font-weight: 700; z-index: 1; box-shadow: 1px 0 0 var(--line); }
.tbl th:first-child { background: var(--s2); }
.tbl td.tl, .tbl th.tl { text-align: left; }
.tbl td.dim { color: var(--tx3); }
.tbl td.wrap { white-space: normal; min-width: 150px; }
.table-card .tbl-wrap { border: none; border-radius: 0; }
.tbl a.cell, .tbl button.cell { color: var(--accent); font-weight: 700; }
.tbl-note { font-size: .74rem; color: var(--tx3); margin-top: var(--sp2); }

/* résultats en cartes (mobile) */
.res-list { display: flex; flex-direction: column; gap: var(--sp2); }
.res { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: var(--sp3); align-items: center; width: 100%; text-align: left;
  background: var(--s1); border: 1px solid var(--line); border-radius: var(--r2); padding: 10px var(--sp3); box-shadow: var(--sh1); }
button.res:active { background: var(--s3); }
.res .rk { height: 32px; border-radius: var(--r1); background: var(--s3); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .9rem; font-variant-numeric: tabular-nums; }
.res .rk.r1 { background: var(--jaune); color: #111827; } .res .rk.r2 { background: var(--argent); color: #111827; } .res .rk.r3 { background: var(--bronze); color: #111827; }
.res .t { min-width: 0; }
.res .t b { display: block; font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
.res .t small { display: block; color: var(--tx3); font-size: .74rem; margin-top: 2px; }
.res .d { font-size: .74rem; color: var(--tx3); text-align: right; white-space: nowrap; }
.grp-title { display: flex; align-items: baseline; justify-content: space-between; margin: var(--sp4) 0 var(--sp2); font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--tx2); }
.grp-title span { font-weight: 600; color: var(--tx3); letter-spacing: 0; text-transform: none; }

/* mini-graphique en ligne */
.spark { display: block; width: 100%; height: auto; }
.spark .ax { stroke: var(--line); stroke-width: 1; }
.spark .gl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.spark .pt { fill: var(--s1); stroke: var(--accent); stroke-width: 2; }
.spark .pt.last { fill: var(--accent); }
.spark text { fill: var(--tx3); font-size: 11px; font-family: inherit; }

/* squelettes de chargement, état vide */
.sk { background: linear-gradient(90deg, var(--s2) 25%, var(--s3) 50%, var(--s2) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: var(--r1); }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk, .loading::before { animation: none; } }
.sk-line { height: 14px; margin: 8px 0; } .sk-tile { height: 74px; border-radius: var(--r2); } .sk-circle { width: 84px; height: 84px; border-radius: 50%; flex: none; }
.vide { text-align: center; color: var(--tx3); font-size: .9rem; padding: var(--sp5) var(--sp4); border: 1px dashed var(--line); border-radius: var(--r2); }
.src-note { font-size: .72rem; color: var(--tx3); }

/* ================== fiche coureur (E2) ================== */
.rpage { display: flex; flex-direction: column; gap: var(--sp3); }
.rmain { display: flex; flex-direction: column; gap: var(--sp3); min-width: 0; }
.rside { min-width: 0; }
.tabcontent { display: flex; flex-direction: column; gap: var(--sp3); min-width: 0; }
.foot-credits { font-size: .72rem; color: var(--tx3); border-top: 1px solid var(--line); padding-top: var(--sp3); line-height: 1.5; }
.foot-credits a { color: var(--tx2); }
.frise { list-style: none; position: relative; margin-left: 6px; border-left: 2px solid var(--line); }
.frise li { position: relative; padding: 0 0 var(--sp3) var(--sp4); }
.frise li::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--s1); border: 2px solid var(--accent); }
.frise b { display: block; font-size: .92rem; }
.frise span { font-size: .78rem; color: var(--tx3); }
.frise .frise-sub { display: block; font-size: .72rem; color: var(--tx3); margin-top: 2px; }
.chart-card { padding: var(--sp3); }
.wiki-links { display: flex; flex-wrap: wrap; gap: var(--sp2); }
.wiki-links a { text-decoration: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--s2); color: var(--tx); font-size: .82rem; font-weight: 600; }
.wiki-links a:hover { border-color: var(--accent); }
.mv-up { color: var(--ok); } .mv-down { color: var(--bad); }
@media (min-width: 880px) {
  .rpage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--sp4) var(--sp5); align-items: start; }
  .rside { grid-column: 2; grid-row: 1; position: sticky; top: calc(var(--bar-h) + var(--sp3)); }
  .rmain { grid-column: 1; grid-row: 1; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
  .kpis .tile:last-child:nth-child(odd) { grid-column: auto; }
  .res { grid-template-columns: 38px minmax(0, 1fr) auto; }
}

/* ================== pages épreuve et édition (E3) ================== */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp2); margin-top: var(--sp3); }
.pod { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r1); padding: var(--sp2); min-width: 0; text-align: center; }
.pod.r1 { border-color: var(--jaune); }
.pod .pk { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 24px; padding: 0 6px; border-radius: var(--r1); font-weight: 800; font-size: .85rem; background: var(--s3); font-variant-numeric: tabular-nums; }
.pod .pk.r1 { background: var(--jaune); color: #111827; } .pod .pk.r2 { background: var(--argent); color: #111827; } .pod .pk.r3 { background: var(--bronze); color: #111827; }
.pod .nm { font-weight: 700; font-size: .82rem; line-height: 1.2; margin-top: var(--sp2); overflow-wrap: anywhere; }
.pod .nm .flag { display: block; margin: 0 auto 4px; }
.pod .tm { font-size: .68rem; color: var(--tx3); margin-top: 2px; overflow-wrap: anywhere; line-height: 1.2; }
.ednav { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--sp2); align-items: center; margin-top: var(--sp3); }
.ednav button { font-size: .82rem; font-weight: 700; padding: 8px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--s2); color: var(--tx); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ednav button:active, .ednav button:hover { background: var(--s3); }
.ednav .all { color: var(--accent); }
.ednav .prev { justify-self: start; } .ednav .next { justify-self: end; }
.ednav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.team-card { border: 1px solid var(--line); border-radius: var(--r1); background: var(--s1); overflow: hidden; margin: var(--sp2); }
.team-head { display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; padding: 8px 10px; background: var(--s2); border-bottom: 1px solid var(--line); }
.team-head .tn { font-weight: 700; font-size: .88rem; min-width: 0; overflow-wrap: anywhere; }
.team-head .small { margin-left: auto; text-align: right; }
.team-card .row:last-child { border-bottom: none; }
.team-head { position: relative; flex-wrap: nowrap; min-height: 52px; }
.team-card:not(.ouvert) .team-head { border-bottom: none; }
.th-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.th-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: .76rem; color: var(--tx3); }
.team-head .tn a, .team-head .badge, .team-head .pill-fr { position: relative; z-index: 1; }
.tc-tog { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: 0 0 auto; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; }
.tc-tog::after { content: ""; position: absolute; inset: 0; }
.tc-tog svg { width: 20px; height: 20px; fill: none; stroke: var(--tx3); stroke-width: 2; transition: transform .15s; }
.tc-tog[aria-expanded="true"] svg { transform: rotate(180deg); }
.tc-logo { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 8px; background: var(--blanc); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.tc-logo img { max-width: 30px; max-height: 30px; object-fit: contain; }
.tc-logo.maillot { background: none; width: 34px; height: 38px; border-radius: 0; }
.tc-logo.maillot img { max-width: 36px; max-height: 38px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.tc-logo.ini { background: var(--s3); color: var(--tx2); font-size: .7rem; font-weight: 800; letter-spacing: .02em; }
.pill-fr { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; color: var(--tx2); flex: 0 0 auto; }
.pill-fr img { width: 16px; height: auto; border-radius: 2px; }
.tools-l { display: inline-flex; gap: var(--sp4); flex-wrap: wrap; }
.res-box { display: flex; flex-direction: column; gap: 2px; }
.res-ep { align-self: flex-end; font-size: .72rem; font-weight: 600; color: var(--accent); padding: 2px 6px; border-radius: 99px; }
.res-ep:hover, .res-ep:focus-visible { background: var(--accent-soft); outline: none; }

/* ================== recherche globale (E2) ================== */
.sr-input { flex: 1; min-width: 0; font-size: 1rem; padding: 10px 12px; border-radius: 99px; }
.sr-body { padding: var(--sp3) 0 var(--sp5); }
.sr-grp { margin-bottom: var(--sp4); }
.sr-list { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; }
.sr-item { display: flex; align-items: center; gap: var(--sp3); width: 100%; text-align: left; padding: 11px var(--sp3); border-top: 1px solid var(--line); min-height: 48px; }
.sr-item:first-child { border-top: none; }
.sr-item.nav { cursor: pointer; }
.sr-item.nav:hover, .sr-item.sel { background: var(--s3); }
.sr-item .nm { font-weight: 600; min-width: 0; flex: 1; overflow-wrap: anywhere; }
.sr-item .yr { font-size: .74rem; color: var(--tx3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sr-item.off .nm { color: var(--tx2); font-weight: 500; }
.sr-hint { color: var(--tx3); text-align: center; padding: var(--sp6) var(--sp4); font-size: .9rem; }
.sr-more { display: block; width: 100%; padding: 10px; font-size: .82rem; font-weight: 700; color: var(--accent); border-top: 1px solid var(--line); }

/* ================== encyclopédie : gabarit d'article, listes, accueil (R1) ================== */
a { text-underline-offset: 2px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: .78rem; color: var(--tx3); margin-bottom: var(--sp2); line-height: 1.5; }
.crumbs a { color: var(--tx2); text-decoration: none; padding: 4px 0; }
.crumbs a:hover, .crumbs a:focus-visible { color: var(--accent); text-decoration: underline; outline: none; }
.crumbs .sep { opacity: .6; }
.crumbs [aria-current] { overflow-wrap: anywhere; }
.art { min-width: 0; }
.art-head { margin-bottom: var(--sp3); }
.art-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--sp2); color: var(--tx2); font-size: .9rem; margin-top: var(--sp2); }
.art-sub .flag { width: 22px; height: 15px; }
.art-head .hero-pills { margin-top: var(--sp2); }
.infobox { padding: var(--sp3) var(--sp4) var(--sp4); }
.infobox > .facts:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.ib-photo { display: flex; justify-content: center; margin-bottom: var(--sp2); }
.ib-photo .hero-photo { width: 96px; height: 96px; }
.hero-portrait { position: relative; width: 160px; aspect-ratio: 4 / 5; border-radius: var(--r2); overflow: hidden; background: var(--s3); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 2rem; color: var(--tx3); }
.hero-portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
.hero-portrait img.noimg { display: none; }
.hero-portrait:has(img.noimg) { width: 84px; aspect-ratio: 1; border-radius: 50%; font-size: 1.6rem; }
@media (min-width: 880px) { .ib-photo .hero-portrait { width: 100%; max-width: 260px; } .ib-photo .hero-portrait:has(img.noimg) { width: 84px; } }
.ib-title { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--tx3); margin-bottom: var(--sp1); }
.infobox .credit { text-align: center; }
.sec-h { font-size: 1.05rem; font-weight: 700; margin: 0 0 var(--sp2); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
details.navbox { border: 1px solid var(--line); border-radius: var(--r2); background: var(--s1); margin-top: var(--sp5); overflow: hidden; }
details.navbox > summary { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); min-height: 48px; padding: 8px var(--sp4); cursor: pointer;
  list-style: none; font-weight: 700; font-size: .88rem; background: var(--s2); }
details.navbox > summary::-webkit-details-marker { display: none; }
details.navbox > summary::after { content: "›"; transform: rotate(90deg); color: var(--tx3); font-size: 1.2rem; transition: transform .15s; }
details.navbox[open] > summary::after { transform: rotate(-90deg); }
details.navbox > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nb-body { padding: var(--sp3) var(--sp4) var(--sp4); display: flex; flex-direction: column; gap: var(--sp2); }
.nb-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.nb-row .nb-l { flex: none; min-width: 56px; font-size: .72rem; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: .04em; }
.nb-a { display: inline-flex; align-items: center; min-height: 32px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--s2); color: var(--tx);
  font-size: .8rem; font-weight: 600; text-decoration: none; font-variant-numeric: tabular-nums; }
.nb-a:hover { border-color: var(--accent); }
.nb-a[aria-current] { background: var(--accent); border-color: var(--accent); color: #fff; }
.pg-title { font-size: 1.45rem; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; }
.pg-sub { color: var(--tx3); font-size: .85rem; margin-top: 2px; }
.tools { display: flex; flex-direction: column; gap: var(--sp2); }
.tools .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp2); }
.sel { min-height: 44px; }
.search { min-height: 44px; }
.chip { min-height: 36px; display: inline-flex; align-items: center; }
.more { min-height: 44px; }
.crows { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; }
.crow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: var(--sp3); align-items: center; min-height: 52px; padding: 8px var(--sp3);
  border-top: 1px solid var(--line); color: var(--tx); text-decoration: none; }
.crow:first-child { border-top: none; }
a.crow:hover, a.crow:focus-visible { background: var(--s2); outline: none; }
a.crow:active { background: var(--s3); }
.crow .nm { font-weight: 600; font-size: .92rem; line-height: 1.25; overflow-wrap: anywhere; }
.crow .sm { font-size: .74rem; color: var(--tx3); line-height: 1.3; margin-top: 1px; overflow-wrap: anywhere; }
.crow .rt { text-align: right; font-size: .78rem; color: var(--tx2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.crow .rt b { display: block; font-size: .9rem; }
.crow.fr { box-shadow: inset 3px 0 0 var(--fr); }
.crow .badge { margin-left: 4px; vertical-align: 1px; }
.count-line { font-size: .78rem; color: var(--tx3); }
a.res { color: var(--tx); text-decoration: none; }
.wd-s { font-size: .55rem; font-weight: 800; color: var(--tx3); margin-left: 2px; letter-spacing: .02em; vertical-align: top; }
.tbl a.cell:hover { text-decoration: underline; }
.tbl td > div.small { white-space: normal; min-width: 180px; }
a.nb-a .wd-s { color: inherit; opacity: .7; }
/* accueil */
.home { display: grid; gap: var(--sp5); grid-template-columns: minmax(0, 1fr); }
.home .col { display: contents; }
.blk { min-width: 0; }
.blk-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp3); margin-bottom: var(--sp2); }
.blk-h h2 { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--tx2); }
.blk-h a { font-size: .8rem; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; padding: 6px 0; }
.blk-h a:hover { text-decoration: underline; }
.o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; } .o5 { order: 5; } .o6 { order: 6; } .o7 { order: 7; }
.summary.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.minis { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; }
.mini { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: var(--sp2); align-items: center; width: 100%; text-align: left; min-height: 52px;
  padding: 8px var(--sp3); border-top: 1px solid var(--line); color: var(--tx); text-decoration: none; }
.minis > :first-child { border-top: none; }
button.mini:hover, a.mini:hover { background: var(--s2); }
.mini .d { font-size: .76rem; font-weight: 600; color: var(--tx3); line-height: 1.25; }

.mv-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp3); }

.mv-col ul { list-style: none; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r1); }

details.mv-an > summary { display: flex; align-items: baseline; gap: var(--sp2); min-height: 48px; padding: 10px var(--sp4); cursor: pointer; list-style: none; font-weight: 800; background: var(--s2); }
details.mv-an > summary::-webkit-details-marker { display: none; }

<script>
"use strict";
/* ================== configuration & utilitaires ================== */
const PARAMS = new URLSearchParams(location.search);
const BASE = (() => {
  const d = PARAMS.get("data") || "data";
  // dossier relatif uniquement : pas de schéma, pas de « .. », pas de chemin absolu
  return /^[\w\-./]+$/.test(d) && !d.includes("..") && !d.startsWith("/") ? d.replace(/\/+$/, "") : "data";
})();

/** Base des archives (saisons passées) : `?archives=<url>` si donné (https ou chemin relatif) ; sinon, avec `?data=` (jeu
 *  d'essai), `<data>/archives` en local ; sinon le dépôt d'archives (GitHub Pages, CORS ouvert). */
const BASE_ARCHIVES = (() => {
  const a = PARAMS.get("archives");
  if (a && (/^https:\/\/[\w\-.]+(:\d+)?(\/[\w\-./]*)?$/.test(a) || /^[\w\-./]+$/.test(a)) && !a.includes("..") && !a.startsWith("/"))
    return a.replace(/\/+$/, "");
  if (PARAMS.get("data")) return `${BASE}/archives`;
  return "https://camelbaggy.github.io/courses-cyclistes-archives/data/archives";
})();

/** Maillots WorldDB (vues de face générées par tools/maillots.py, publiées avec le site) : `?maillots=<chemin relatif>` (jeu d'essai), sinon `maillots`. */
const BASE_MAILLOTS = (() => {
  const m = PARAMS.get("maillots");
  return m && /^[\w\-./]+$/.test(m) && !m.includes("..") && !m.startsWith("/") ? m.replace(/\/+$/, "") : "maillots";
})();

const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(v) { return v == null ? "" : String(v).replace(/[&<>"']/g, c => ESC_MAP[c]); }

function flag(code, nom) {
  if (!code || !/^[a-z]{2}(-[a-z]{2,3})?$/i.test(code)) return '<span class="flag"></span>';
  const c = code.toLowerCase();
  return `<img class="flag" loading="lazy" src="https://flagcdn.com/w40/${esc(c)}.png" alt="${esc(nom || c)}" title="${esc(nom || "")}">`;
}
document.addEventListener("error", e => {
  if (e.target && e.target.tagName === "IMG") e.target.classList.add("noimg");
}, true);

const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const MOIS_C = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
function pd(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
function dateLongue(iso) { const p = pd(iso); return p ? `${p.d === 1 ? "1er" : p.d} ${MOIS[p.m - 1]} ${p.y}` : ""; }
function dateCourte(iso) { const p = pd(iso); return p ? `${p.d} ${MOIS_C[p.m - 1]}` : ""; }
function plage(a, b) {
  const pa = pd(a), pb = pd(b);
  if (!pa) return "";
  if (!pb || a === b) return dateCourte(a);
  if (pa.m === pb.m && pa.y === pb.y) return `${pa.d}–${pb.d} ${MOIS_C[pa.m - 1]}`;
  return `${dateCourte(a)} – ${dateCourte(b)}`;
}
const nf = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
function num(n) { return n == null ? "" : nf.format(n); }
function p2(n) { return String(n).padStart(2, "0"); }
/** h:mm:ss */
function fmtTemps(s) {
  if (s == null) return "";
  s = Math.round(s);
  return `${Math.floor(s / 3600)}:${p2(Math.floor(s % 3600 / 60))}:${p2(s % 60)}`;
}
/** +m:ss (ou +h:mm:ss au-delà d'une heure) ; « m.t. » pour un écart nul */
function fmtEcart(s) {
  if (s == null) return "";
  s = Math.round(s);
  if (s === 0) return "m.t.";
  if (s >= 3600) return `+${fmtTemps(s)}`;
  return `+${Math.floor(s / 60)}:${p2(s % 60)}`;
}
function rang(n) { return n == null ? "" : n === 1 ? "1er" : `${n}e`; }

const CATS = ["WT", "Pro", "FDJ", ".1", ".2", "Champ."];
const STATUTS = { DNF: "Abandons (DNF)", DNS: "Non-partants (DNS)", OTL: "Hors délai (OTL)", DSQ: "Disqualifiés (DSQ)", DNQ: "Non qualifiés (DNQ)" };
const TYPES = { itt: "Contre-la-montre", ttt: "CLM par équipes", road: "En ligne" };

/* ================== chargement des données ================== */
const cache = new Map();
/** URL d'un fichier : les chemins « archives/… » viennent du dépôt d'archives (BASE_ARCHIVES), le reste de BASE. */
function urlDonnee(chemin) {
  return chemin.startsWith("archives/") ? `${BASE_ARCHIVES}/${chemin.slice(9)}` : `${BASE}/${chemin}`;
}
async function charger(chemin) {
  if (cache.has(chemin)) return cache.get(chemin);
  const url = urlDonnee(chemin);
  const p = fetch(url, { cache: "no-cache" }).then(r => {
    if (!r.ok) { const e = new Error(`HTTP ${r.status} pour ${url}`); e.status = r.status; throw e; }
    return r.json();
  }, err => {   // réseau, CORS, site injoignable (pas de statut HTTP)
    const e = new Error(chemin.startsWith("archives/")
      ? `site des archives injoignable (${BASE_ARCHIVES})` : `réseau indisponible (${url})`);
    e.reseau = true;
    throw e;
  });
  cache.set(chemin, p);
  p.catch(() => cache.delete(chemin));   // une erreur n'est pas mise en cache
  return p;
}
/** Lecture d'un fichier d'archive : `chemin` relatif au dossier des archives (« index.json », « 2024/races/<id>.json »…). */
function chargerArchive(chemin) { return charger(`archives/${chemin}`); }

/** Nom de coureur cliquable (ouvre l'article du coureur) ; sans identifiant : texte simple. */
function plink(id, texte, ctx) {
  // ctx (optionnel) : saison dont la fiche doit être lue, « a2023 » (archive) ou « c2027 » (Calendrier) ; défaut : saison de la page affichée
  const c = ctx || state.ctxPage;
  return id ? `<span class="rlink" role="link" tabindex="0" data-rider="${esc(id)}"${c ? ` data-rctx="${esc(c)}"` : ""}>${esc(texte)}</span>` : esc(texte);
}

const state = { index: null, indexes: {}, riders: null, ridersFor: null, saisons: null, current: null,
  // page affichée : route, jeton (une page lente qui finit après une navigation ne dessine plus), saison de contexte des liens coureur
  route: null, routeTok: 0, ctxPage: null, restaurer: null, seq: 0,
  // fiche course
  course: null, sel: null, sub: null, subVoulu: null, frOnly: false, partTous: false, partOuv: {}, limit: 50, courseArchive: null,
  // classements
  ranking: undefined, ridersCl: undefined, uc: { fr: false, q: "", limit: 100 }, clData: {},
  // archives : index (undefined = pas chargé, null = indisponible), index par saison, chemin (année) de chaque course d'archive connue
  archIdx: undefined, archErr: null, archIndexes: {}, archChemins: new Map(),
  // fiche coureur : données assemblées, onglet par coureur, filtres du palmarès, pays et noms de courses (entités)
  cr: null, rtabs: {}, rpal: { cat: "all", vic: false }, pays: undefined, coursesEnt: {}, rtab: "apercu", coureurOuvert: null,
  // recherche globale
  sr: { q: "", res: null, sel: -1, tout: {}, token: 0, msg: "" },
  // édition : navigation précédente / suivante ({id, nav} ; nav null = inconnue), équipes de la saison, participants mémorisés ;
  // épreuve : données assemblées, onglet par épreuve
  nav: null, navLoading: null, eqSaison: {}, partMemo: null, ep: null, etab: "palmares", etabs: {}, epreuveOuverte: null,
  // listes (chargées à la demande) : index des coureurs, des épreuves, des équipes-saisons, compteurs ; filtres de la page Coureurs
  cIdx: undefined, eIdx: undefined, eqIdx: undefined, entIdx: undefined, co: null,
  // articles d'équipe : données assemblées, onglet par équipe, index des lignées (undefined = pas chargé, null = absent)
  eq: null, eqtab: "effectif", eqtabs: {}, equipeOuverte: null, lgIdx: undefined };

/* ================== éléments communs ================== */
const CLASSES_ANCIENNES = {
  "1.HC": "ancienne classe HC, équivalent Pro", "2.HC": "ancienne classe HC, équivalent Pro",
  "1.CH": "calendrier historique (avant 2011), équivalent WorldTour", "2.CH": "calendrier historique (avant 2011), équivalent WorldTour",
  "CPE": "ProTour (avant 2011), équivalent WorldTour", "AU1": "ProTour (avant 2011), équivalent WorldTour", "MNM": "ProTour (avant 2011), équivalent WorldTour",
};
function equivClasse(cl) { return Object.prototype.hasOwnProperty.call(CLASSES_ANCIENNES, cl) ? CLASSES_ANCIENNES[cl] : ""; }
function catBadge(c, cl) {
  const eq = equivClasse(cl);
  return `<span class="badge cat-${esc((c || "").replace(/[^\w]/g, ""))}"${eq ? ` title="${esc(eq)}"` : ""}>${esc(cl || c)}</span>`;
}
function courseParId(id) {
  const ordre = [state.index].concat(Object.values(state.indexes), Object.values(state.archIndexes));
  for (const ix of ordre) { const r = ix && (ix.races || []).find(x => x.id === id); if (r) return r; }
  return null;
}
function ligneCoureur(ref, label, extra) {
  if (!ref) return "";
  return `<div class="winner-line"><span class="pill-label">${esc(label)}</span>${flag(ref.flag, ref.nationality)}
    <div class="who"><div class="nm">${plink(ref.id, ref.name)}${ref.is_french ? ' <span class="badge fr">FR</span>' : ""}</div>
    <div class="small muted">${esc(ref.team || "")}${extra ? " · " + esc(extra) : ""}</div></div></div>`;
}
function messageErreur(msg, action) {
  return `<div class="errbox"><div>${esc(msg)}</div>${action ? `<button data-action="${esc(action)}">Réessayer</button>` : ""}</div>`;
}

/* ================== blocs communs aux pages ================== */
/** Carte d'un dernier résultat (course, étape, vainqueur, meilleur Français, résumé) ; `court` : résumé limité à 3 lignes (accueil). */
function carteEtape(it, court) {
  const c = courseParId(it.race_id);
  const sn = it.stage_number == null ? "" : it.stage_number;
  const bf = it.best_french;
  return `<button class="card click" data-open="${esc(it.race_id)}" data-stage="${esc(sn)}">
    <div class="card-head">${flag(c?.flag, c?.country)}<span class="race-name">${esc(it.race_name)}</span>
      ${c ? catBadge(c.category, c.uci_class) : ""}</div>
    <div class="card-label">${esc(it.label)} · ${esc(dateCourte(it.date))}</div>
    ${ligneCoureur(it.winner, "Vainqueur")}
    ${bf && bf.rank !== 1 ? ligneCoureur(bf.rider, "Meilleur FR", `${rang(bf.rank)}${bf.classification === "gc" ? " au général" : ""}`) : ""}
    ${it.ai_summary ? `<div class="summary${court ? " clamp" : ""}">${esc(it.ai_summary)}</div>` : ""}
  </button>`;
}

function saisonTerminee(y, ix) {
  if (y < state.current) return true;
  if (y > state.current) return false;
  return !((ix.upcoming || []).length);
}

/** Courses groupées par mois (liste commune au Calendrier et aux Archives) ; `tout` déjà filtré et trié. */
function listeCourses(tout) {
  let html = "";
  let mois = "";
  tout.forEach(r => {
    const p = pd(r.start_date);
    const m = p ? `${MOIS[p.m - 1]} ${p.y}` : "Date inconnue";
    if (m !== mois) { mois = m; html += `<div class="month">${esc(m)}</div>`; }
    const inner = `<div class="cal-date">${esc(plage(r.start_date, r.end_date))}</div>
      <div class="cal-main"><div class="card-head" style="margin:0">${flag(r.flag, r.country)}
        <span class="race-name">${esc(r.name)}</span></div>
        <div class="small muted" style="margin-top:3px">${catBadge(r.category, r.uci_class)}
        ${r._futur ? ' <span class="badge">à venir</span>' : r.status === "in_progress" ? ` <span class="badge live">en cours · ${r.stages_done}${r.stages_total ? "/" + r.stages_total : ""} étapes</span>` : ""}
        ${r.race_type === "stage_race" && !r._futur && r.status !== "in_progress" ? ` <span class="badge">${r.stages_done} étapes</span>` : ""}</div>
        ${!r._futur && (r.winner || r.leader) ? `<div class="small" style="margin-top:4px">${r.winner ? "Vainqueur" : "Leader"} : <b>${plink((r.winner || r.leader).id, (r.winner || r.leader).name)}</b>${(r.winner || r.leader).is_french ? ' <span class="badge fr">FR</span>' : ""}</div>` : ""}
      </div>`;
    html += r._futur
      ? `<div class="card cal-item future" style="margin-bottom:6px">${inner}</div>`
      : `<button class="card click cal-item" style="margin-bottom:6px" data-open="${esc(r.id)}" data-stage="">${inner}</button>`;
  });
  return html;
}

function renderFdj() {
  const f = state.index.fdj_united_series;
  if (!f) return `<div class="empty card">FDJ United Series : classement indisponible.</div>`;
  const indiv = f.individual || [];
  const lignes = indiv.map(r => `<div class="row">
      <div class="rk">${esc(r.rank)}</div><span></span>
      <div class="mid"><div class="nm">${esc(r.rider)}</div><div class="tm">${esc(r.team || "")}</div></div>
      <div class="val">${esc(num(r.points))} pts</div></div>`).join("");
  const manches = (f.races || []).map(m => {
    const dispo = m.race_id && courseParId(m.race_id);

const ISO3 = { FRA:"fr",BEL:"be",NED:"nl",ITA:"it",ESP:"es",GBR:"gb",GER:"de",SUI:"ch",DEN:"dk",NOR:"no",SWE:"se",FIN:"fi",POL:"pl",CZE:"cz",SVK:"sk",SLO:"si",CRO:"hr",AUT:"at",POR:"pt",IRL:"ie",LUX:"lu",HUN:"hu",ROU:"ro",BUL:"bg",SRB:"rs",UKR:"ua",RUS:"ru",BLR:"by",LAT:"lv",LTU:"lt",EST:"ee",GRE:"gr",TUR:"tr",ISR:"il",KAZ:"kz",UZB:"uz",USA:"us",CAN:"ca",MEX:"mx",COL:"co",ECU:"ec",VEN:"ve",CHI:"cl",ARG:"ar",BRA:"br",URU:"uy",PER:"pe",CRC:"cr",AUS:"au",NZL:"nz",RSA:"za",ERI:"er",ETH:"et",RWA:"rw",MAR:"ma",ALG:"dz",TUN:"tn",EGY:"eg",JPN:"jp",CHN:"cn",KOR:"kr",HKG:"hk",THA:"th",MAS:"my",INA:"id",IRI:"ir",UAE:"ae",BRN:"bh",LAO:"la",VIE:"vn",SGP:"sg",MON:"mc",AND:"ad",ISL:"is",LIE:"li",GEO:"ge",ARM:"am",AZE:"az",MDA:"md",MKD:"mk",ALB:"al",BIH:"ba",MNE:"me",MLT:"mt",CYP:"cy",NAM:"na",BOT:"bw",DOM:"do",CUB:"cu",PAN:"pa",GUA:"gt",TTO:"tt",TPE:"tw",PHI:"ph",IND:"in",PAK:"pk",SYR:"sy",SRI:"lk",MGL:"mn",QAT:"qa",KSA:"sa",KGZ:"kg" };
function normaliser(t) { return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function drapeauIso3(n) {
  const c = ISO3[n];
  return c ? flag(c, n) : `<span class="cc">${esc(n || "")}</span>`;
}
async function chargerRanking() {

/** Ligne du classement UCI ; `ids` : fiches connues (objet par id, ou fonction id -> booléen ; le nom n'est cliquable que s'il y a une fiche), null = toujours cliquable. */
function ligneUci(r, ids) {
  const mv = r.previous_rank == null || r.rank == null ? ""
    : r.previous_rank > r.rank ? `<span class="mv up">▲${r.previous_rank - r.rank}</span>`
    : r.previous_rank < r.rank ? `<span class="mv down">▼${r.rank - r.previous_rank}</span>` : `<span class="mv">=</span>`;
  const nom = r.name || r.rider || "";
  const lien = r.rider_id && (!ids || (typeof ids === "function" ? ids(r.rider_id) : ids[r.rider_id]));
  return `<div class="row uc ${r.nationality === "FRA" ? "fr" : ""}">
    <div class="rk">${esc(r.rank)}${mv}</div>${drapeauIso3(r.nationality)}
    <div class="mid"><div class="nm">${lien ? plink(r.rider_id, nom) : esc(nom)}</div><div class="tm">${esc(r.team || "")}</div></div>
    <div class="val">${esc(num(r.points))}<small>pts</small></div></div>`;
}
/** Lignes (déjà filtrées par la recherche et le filtre Français) d'un jeu de rangs `rows` ; `ids` : voir ligneUci. */
function lignesUci(rows, ids) {
  const U = state.uc;
  const total = rows.length;
  if (U.fr) rows = rows.filter(r => r.nationality === "FRA");
  const q = normaliser(U.q).trim();
  if (q) rows = rows.filter(r => normaliser(r.name).includes(q) || normaliser(r.rider).includes(q));
  const vis = rows.slice(0, U.limit), reste = rows.length - vis.length;
  const html = vis.map(r => ligneUci(r, ids)).join("");
  const compte = `${rows.length}${rows.length !== total ? " / " + total : ""} coureur${rows.length > 1 ? "s" : ""}`;
  return { compte, html: (html ? `<div class="rows">${html}</div>` : `<div class="empty">Aucun coureur trouvé.</div>`)
    + (reste > 0 ? `<button class="more" data-action="uc-more">Afficher ${Math.min(100, reste)} de plus (${reste} restants)</button>` : "") };
}
function majListeUci() {
  const l = document.getElementById("uc-list"); if (!l || !state.clVue) return;
  const r = lignesUci(state.clVue.rows, state.clVue.ids);
  l.innerHTML = r.html;

async function chargerArchivesIndex() {

  }
  if (state.archIdx && !Array.isArray(state.archIdx.seasons)) state.archIdx = null;
  if (state.archIdx) state.archIdx.seasons = state.archIdx.seasons.slice().sort((a, b) => b.season - a.season);
  return state.archIdx;

/** Index d'une saison d'archive (et mémorisation du chemin de chacune de ses courses) ; lève en cas d'échec. */
async function chargerIndexArchive(y) {
  if (state.archIndexes[y]) return state.archIndexes[y];
  const ix = await chargerArchive(`${y}/index.json`);
  (ix.races || []).forEach(r => state.archChemins.set(r.id, y));
  state.archIndexes[y] = ix;
  return ix;
}
/** Cherche l'année d'archive d'une course dont on ne connaît que l'identifiant (lien direct) ; null si absente. */
async function chercherArchive(id) {
  const A = await chargerArchivesIndex();
  for (const s of (A && A.seasons) || []) {
    let ix;
    try { ix = await chargerIndexArchive(s.season); } catch (e) { continue; }
    if ((ix.races || []).some(r => r.id === id)) return s.season;
  }
  return null;
}

/* ================== fiche course ================== */
function etapes(c) { return (c.stages || []).slice().sort((a, b) => (a.number ?? -1) - (b.number ?? -1)); }
function selectionDefaut(c) {
  const E = etapes(c);
  if (c.race_type !== "stage_race") return "";
  if (c.final && c.status === "finished") return "F";
  return E.length ? String(E[E.length - 1].number) : "";
}
function cls(c, sel) {
  const E = etapes(c);
  if (c.race_type !== "stage_race") {
    const st = E[0], r = (st && st.results) || {}, fin = c.final || {};
    const out = {};
    ["stage", "gc", "points", "mountain", "youth", "teams", "combativity"].forEach(k => { out[k] = (r[k] && r[k].length ? r[k] : fin[k]) || []; });
    return out;
  }
  if (sel === "F") return c.final || {};
  const st = E.find(s => String(s.number) === String(sel));
  return (st && st.results) || {};
}
function etapeCourante(c, sel) {
  const E = etapes(c);
  if (c.race_type !== "stage_race") return E[0] || null;
  if (sel === "F") return null;
  return E.find(s => String(s.number) === String(sel)) || null;
}
function libelleChip(s) {
  if (s.number == null) return "Course";
  return s.number === 0 ? "Prol." : `É${s.number}`;
}

function sousTitreCourse(c) {
  const parts = [c.uci_class, plage(c.start_date, c.end_date)];
  if (c.race_type === "stage_race") parts.push(`${c.stages_done}${c.stages_total ? "/" + c.stages_total : ""} étapes`);
  return parts.filter(Boolean).join(" · ");
}

function onglets(c, sel) {
  const k = cls(c, sel);
  const un = c.race_type !== "stage_race";
  const defs = [["stage", un ? "Classement" : "Étape"], ["gc", "Général"], ["points", "Points"], ["mountain", "Montagne"], ["youth", "Jeunes"], ["teams", "Équipes"], ["combativity", "Combatif"]];
  const out = defs.filter(([cle]) => (k[cle] || []).length).map(([cle, lab]) => ({ cle, lab }));
  if (abandons(c, sel).length) out.push({ cle: "abandons", lab: "Abandons" });
  if (participantsCourse(c).length) out.push({ cle: "participants", lab: "Participants" }, { cle: "pays", lab: "Pays" });
  return out;
}

function abandons(c, sel) {
  const E = etapes(c), out = [];
  if (c.race_type !== "stage_race") {
    const k = cls(c, sel);
    (k.stage || []).forEach(r => { if (r.status) out.push({ ...r, _etape: null }); });
    return out;
  }
  const jusqua = sel === "F" ? Infinity : Number(sel);
  E.forEach(s => {
    if (s.number > jusqua) return;
    ((s.results && s.results.stage) || []).forEach(r => { if (r.status) out.push({ ...r, _etape: s }); });
  });
  return out;
}

function ligneHTML(r, cle, c, mvt) {

  if (cle === "points" || cle === "mountain") {
    val = r.points != null ? `${num(r.points)} pts` : "";
  } else if (cle === "combativity") {
    val = "";
  } else {
    const premier = r.rank === 1;
    if (r.status && r.status !== "OTL") val = r.status;
    else if (premier && r.time_s != null) { val = fmtTemps(r.time_s); cls2 = "first"; }
    else if (r.gap_s != null) { val = fmtEcart(r.gap_s); cls2 = "gap"; }
    else if (r.time_s != null) val = fmtTemps(r.time_s);

function renderTable(c, sel, sub) {
  const k = cls(c, sel);
  if (sub === "abandons") {
    const A = abandons(c, sel);
    const groupes = {};
    A.forEach(r => { (groupes[r.status] = groupes[r.status] || []).push(r); });
    const ordre = Object.keys(STATUTS).filter(s => groupes[s]).concat(Object.keys(groupes).filter(s => !STATUTS[s]));
    const frOnly = state.frOnly;
    let html = "";
    ordre.forEach(s => {
      const rows = groupes[s].filter(r => !frOnly || (c.riders[r.rider_id] || {}).is_french);
      if (!rows.length) return;
      html += `<div class="group-title">${esc(STATUTS[s] || s)} · ${rows.length}</div><div class="rows">${rows.map(r => {
        const ref = c.riders[r.rider_id];
        const lib = r._etape ? (r._etape.number === 0 ? "Prologue" : `Étape ${r._etape.number}`) : "";
        return `<div class="row ${ref && ref.is_french ? "fr" : ""}"><div class="rk">–</div>${ref ? flag(ref.flag, ref.nationality) : "<span></span>"}
          <div class="mid"><div class="nm">${ref ? plink(r.rider_id, ref.name) : esc(r.bib ? "Dossard " + r.bib : "Coureur inconnu")}</div><div class="tm">${esc(ref ? ref.team : "")}</div></div>
          <div class="val gap">${esc(lib)}</div></div>`;
      }).join("")}</div>`;
    });
    return html || `<div class="empty">${frOnly ? "Aucun Français parmi les abandons." : "Aucun abandon."}</div>`;
  }
  if (sub === "participants") return htmlParticipants(c);
  if (sub === "pays") return htmlPays(c);
  let rows = k[sub] || [];
  if (!rows.length) return `<div class="empty">Classement non publié</div>`;
  // mouvements au général : comparaison avec l'étape précédente
  let prev = null;
  if (sub === "gc" && c.race_type === "stage_race" && sel !== "F") {
    const E = etapes(c), i = E.findIndex(s => String(s.number) === String(sel));
    if (i > 0) { prev = {}; ((E[i - 1].results || {}).gc || []).forEach(r => { prev[r.rider_id] = r.rank; }); }
  }
  const total = rows.length;
  if (state.frOnly && sub !== "teams") {
    rows = rows.filter(r => (c.riders[r.rider_id] || {}).is_french);
    if (!rows.length) return `<div class="empty">Aucun Français dans ce classement.</div>`;
  }
  const limite = state.frOnly ? rows.length : state.limit;
  const vis = rows.slice(0, limite);
  const html = vis.map(r => sub === "teams" ? ligneEquipe(r, c)
    : ligneHTML(r, sub, c, prev && prev[r.rider_id] != null && r.rank != null ? prev[r.rider_id] - r.rank : null)).join("");
  const reste = rows.length - vis.length;
  return `<div class="rows">${html}</div>` + (reste > 0 ? `<button class="more" data-action="more">Afficher ${Math.min(50, reste)} de plus (${reste} restants)</button>` : "");
}

/* ---- gabarit d'article (commun aux articles coureur, épreuve, édition) ---- */
/** Fil d'Ariane : items [libellé, href] ; le dernier (sans href) est la page courante. */
function htmlCrumbs(items) {
  return `<nav class="crumbs" aria-label="Fil d'Ariane">${items.map((it, i) => i === items.length - 1
    ? `<span aria-current="page">${esc(it[0])}</span>`
    : `<a href="${esc(it[1])}">${esc(it[0])}</a><span class="sep" aria-hidden="true">›</span>`).join("")}</nav>`;
}
/** En-tête d'article : fil d'Ariane (HTML), titre (texte), sous-titre (HTML), pastilles (HTML). */
function htmlArtHead(o) {
  return `<header class="art-head">${o.crumbs || ""}<h1 class="h-title">${esc(o.titre)}</h1>
    ${o.sub ? `<div class="art-sub">${o.sub}</div>` : ""}${o.pills ? `<div class="hero-pills">${o.pills}</div>` : ""}</header>`;
}
/** Infobox (à droite à partir de 880 px, en tête sur mobile, en carte) : `photo` (HTML du rond), `credit` (HTML), `faits` [[libellé, valeur]] (échappés ici ; un 3e élément vrai : valeur déjà en HTML échappé),

function htmlInfobox(o) {

    ${(o.faits || []).length ? `<dl class="facts">${o.faits.map(([k, v, html]) => `<dt>${esc(k)}</dt><dd${html === "lignes" ? ' class="lines"' : ""}>${html ? v : esc(v)}</dd>`).join("")}</dl>` : ""}${o.extra || ""}</div>`;

/** Boîte de navigation repliable (pied d'article) ; `corps` : HTML. */
function htmlNavbox(titre, corps, ouvert) {

}
/** Années d'une épreuve groupées par décennie (récentes d'abord) : liens vers les éditions ; `courant` : race_id de la page affichée. */
function htmlAnneesEditions(eds, courant) {
  const dec = new Map();
  eds.forEach(x => { const d = Math.floor(x.season / 10) * 10; if (!dec.has(d)) dec.set(d, []); dec.get(d).push(x); });
  return [...dec.entries()].sort((a, b) => b[0] - a[0]).map(([d, l]) => `<div class="nb-row"><span class="nb-l">${d}</span>${l.map(x => x.race_id === courant

    : lienWd(x.qid, `${esc(x.season)}<sup class="wd-s">WD</sup>`, "nb-a")).join("")}</div>`).join("");
}
/** Article : en-tête, infobox (colonne de droite à partir de 880 px), colonne principale, boîte de navigation. */
function htmlArticle(o) {
  return `<article class="art">${o.head}<div class="rpage"><aside class="rside">${o.infobox}</aside><div class="rmain">${o.main}</div></div>${o.navbox || ""}</article>`;
}

/* ================== clés d'édition, navigation entre éditions, podium, participants (E3) ================== */
/** Clé d'une édition : nom normalisé + « |PAYS ». DOIT RESTER ALIGNÉE avec collector.cle_edition (Python) : minuscules, sans
 *  accents, ponctuation remplacée par une espace, sans année (1900-2099) ni numéro d'édition isolé (107e, 3rd…). Rapprochement
 *  exact uniquement ; nom ou pays vide : null. */
function cleEdition(nom, pays) {
  const p = String(pays || "").trim().toUpperCase();
  const t = String(nom || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ");
  const mots = t.split(" ").filter(m => m && !/^(19|20)\d\d$/.test(m) && !/^\d+(e|er|ere|eme|th|st|nd|rd)$/.test(m));
  return mots.length && p ? mots.join(" ") + "|" + p : null;
}
/** Clé après application des alias manuels (editions.json.alias, copie d'alias_courses.json) ; un seul niveau, jamais deviné. */
function cleCanon(nom, pays, alias) {
  const k = cleEdition(nom, pays);
  return k && Object.prototype.hasOwnProperty.call(alias, k) ? alias[k] : k;
}
async function chargerEditionsIdx() {
  try {
    const d = await chargerArchive("editions.json");
    return { alias: d.alias || {}, courses: d.courses || {} };
  } catch (e) {
    if (e.status === 404) return { alias: {}, courses: {} };
    throw e;
  }
}

/** Catégorie « de rang » d'une classe UCI (miroir de selection.categorie_classe, hors FDJ qui dépend de la course) : WT, Pro, .1, .2, Champ., sinon null. */
const CLASSES_CAT_WT = ["1.UWT", "2.UWT", "1.CH", "2.CH", "CPE", "AU1", "MNM"], CLASSES_CAT_PRO = ["1.Pro", "2.Pro", "1.HC", "2.HC"], CLASSES_CAT_CHAMP = ["CC", "CM", "WC", "OG", "JO", "CN"];
function categorieClasse(cl) {
  const c = String(cl || "").trim();
  if (CLASSES_CAT_WT.includes(c)) return "WT";
  if (CLASSES_CAT_PRO.includes(c)) return "Pro";
  if (CLASSES_CAT_CHAMP.includes(c)) return "Champ.";
  const m = /^[12]\.(.+)$/.exec(c);
  if (!m) return null;
  return m[1].startsWith("1") ? ".1" : m[1].startsWith("2") || m[1].toLowerCase().startsWith("ncup") ? ".2" : null;
}
/** Fichier entites/courses/<lettre>.json (mémorisé) ; {} si absent (404), exception pour une erreur réseau (rien n'est mémorisé). */
async function fichierCourses(l) {
  if (state.coursesEnt[l] !== undefined) return state.coursesEnt[l];
  try { state.coursesEnt[l] = await chargerArchive(`entites/courses/${l}.json`); }
  catch (e) { if (e.status === 404) state.coursesEnt[l] = {}; else throw e; }
  return state.coursesEnt[l];
}
function saisonCourse(c) { return c.season != null ? c.season : ((pd(c.start_date) || {}).y ?? null); }
/** Saison d'une édition : « c<année> » (Calendrier) ou « a<année> » (archive), pour que la fiche coureur lise la bonne saison. */
function ctxSaison(y) { return ((state.saisons && state.saisons.available) || []).includes(y) ? `c${y}` : `a${y}`; }
/** Une édition d'une saison absente du Calendrier vient des archives : on mémorise son chemin (évite un 404 sur races/ à l'ouverture). */
function noterChemin(e) {
  const dispo = (state.saisons && state.saisons.available) || [];
  if (e && e.race_id && e.season != null && !dispo.includes(e.season)) state.archChemins.set(e.race_id, e.season);
}
/** Épreuve (entité de entites/courses/) d'une fiche de course : clé d'édition exacte, sinon clé canonique par alias manuel
 *  (editions.json, lu seulement si la clé brute n'a pas d'entité). null si inconnue. */
async function epreuveDeCourse(c) {
  const cle0 = cleEdition(c.name, c.country);
  if (!cle0) return null;
  let F = await fichierCourses(lettreId(cle0));
  if (aPropre(F, cle0)) return { cle: cle0, C: F[cle0] };
  let alias = {};
  try { alias = (await chargerEditionsIdx()).alias; } catch (e) { return null; }
  const cle = cleCanon(c.name, c.country, alias);
  if (!cle || cle === cle0) return null;
  F = await fichierCourses(lettreId(cle));
  return aPropre(F, cle) ? { cle, C: F[cle] } : null;
}
function ordreEdition(a, b) {
  return (a.season - b.season) || String(a.start_date || "").localeCompare(String(b.start_date || "")) || String(a.race_id || "").localeCompare(String(b.race_id || ""));
}
/** Édition précédente / suivante (hors la fiche affichée) d'après entites/courses ; null si l'épreuve est inconnue ou n'a pas d'autre édition. */
async function navigationEdition(c) {
  const E = await epreuveDeCourse(c);
  if (!E) return null;
  const cur = { season: saisonCourse(c), start_date: c.start_date, race_id: c.id };
  const autres = (E.C.editions || []).filter(e => e.race_id !== c.id && e.season != null);
  const avant = autres.filter(e => ordreEdition(e, cur) < 0).sort((a, b) => ordreEdition(b, a));
  const apres = autres.filter(e => ordreEdition(e, cur) > 0).sort(ordreEdition);
  const prev = avant[0] || null, next = apres[0] || null;
  const eds = (E.C.editions || []).filter(x => x.season != null && x.race_id).slice().sort((a, b) => ordreEdition(b, a));
  eds.forEach(noterChemin);
  const edsNav = eds.concat((E.C.historique || []).map(h => ({ season: h.annee, qid: h.source_qid }))).sort((a, b) => b.season - a.season);
  return { cle: E.cle, nom: nomRecent(E.C, E.cle), prev, next, eds: edsNav };
}
function htmlNavEdition(nav) {
  if (!nav || (!nav.prev && !nav.next)) return "";
  const b = (e, cl, txt, lib) => e ? `<button class="${cl}" data-open="${esc(e.race_id)}" data-stage="" aria-label="${esc(lib)} : ${esc(e.season)}">${txt}</button>` : "<span></span>";
  return `<nav class="ednav" aria-label="Éditions de l'épreuve">${b(nav.prev, "prev", `&lsaquo; ${esc(nav.prev && nav.prev.season)}`, "Édition précédente")}
    <button class="all" data-epreuve="${esc(nav.cle)}">Toutes les éditions</button>${b(nav.next, "next", `${esc(nav.next && nav.next.season)} &rsaquo;`, "Édition suivante")}</nav>`;
}
/** Charge la navigation sans bloquer la fiche ; absente si l'épreuve est inconnue ou en cas d'échec. */
function majNavEdition(c) {
  if ((state.nav && state.nav.id === c.id) || state.navLoading === c.id) return;
  const id = c.id;
  state.navLoading = id;
  navigationEdition(c).then(nav => {
    if (state.navLoading === id) state.navLoading = null;
    state.nav = { id, nav };
    if (!state.course || state.course.id !== id) return;
    const slot = document.getElementById("ednav-slot"), cr = document.getElementById("crumbs-slot"), nb = document.getElementById("navbox-slot");
    if (slot) slot.innerHTML = htmlNavEdition(nav);
    if (cr) cr.innerHTML = crumbsEdition(state.course);
    if (nb) nb.innerHTML = navboxEdition(state.course);
  }).catch(e => { if (state.navLoading === id) state.navLoading = null; console.warn("Navigation entre éditions indisponible :", e.message); });
}

/** Lignes du classement qui désigne le résultat de la course : classement de la course (un jour), général final (par étapes),
 *  à défaut général de la dernière étape qui en a un (course en cours : provisoire). */
function classementGeneral(c) {
  if (c.race_type !== "stage_race") return cls(c, "").stage || [];
  if (c.final && (c.final.gc || []).length) return c.final.gc;
  const E = etapes(c);
  for (let i = E.length - 1; i >= 0; i--) { const g = (E[i].results || {}).gc; if (g && g.length) return g; }
  return [];
}
/** Rangs 1 à 3 (sans statut) d'une course terminée ; rien tant qu'elle est en cours. */
function podiumCourse(c) {
  if (c.status != null && c.status !== "finished") return [];
  return classementGeneral(c).filter(r => r.rider_id && r.rank != null && !r.status && r.rank >= 1 && r.rank <= 3)
    .sort((a, b) => a.rank - b.rank).slice(0, 3);
}
function htmlPodium(c) {
  const P = podiumCourse(c);
  if (!P.length) return "";
  return `<div class="sec-title" style="margin:var(--sp3) 0 0">Podium</div><div class="podium">${P.map(r => {
    const ref = c.riders[r.rider_id];
    return `<div class="pod"><span class="pk r${r.rank}">${esc(r.rank)}</span>
      <div class="nm">${ref ? flag(ref.flag, ref.nationality) : ""}${ref ? plink(r.rider_id, ref.name) : esc(r.bib ? "Dossard " + r.bib : "Coureur inconnu")}</div>
      ${ref && ref.team ? `<div class="tm">${lienEquipe(ref.team, saisonCourse(c))}</div>` : ""}</div>`;
  }).join("")}</div>`;
}

/** Coureurs présents dans les classements de la fiche (les autres n'existent pas pour nous) : id, dossard, rang final (général ou course),
 *  statut (abandon constaté) et fiche coureur de la course. Mémorisé par fiche. */
function participantsCourse(c) {
  if (state.partMemo && state.partMemo.c === c) return state.partMemo.l;
  const par = {}, refs = c.riders || {};
  const lire = L => (Array.isArray(L) ? L : []).forEach(r => {
    if (!r || !r.rider_id) return;
    const p = par[r.rider_id] || (par[r.rider_id] = { id: r.rider_id, bib: null, rang: null, statut: null });
    if (p.bib == null && r.bib != null) p.bib = r.bib;
  });
  etapes(c).forEach(s => Object.values(s.results || {}).forEach(lire));
  Object.values(c.final || {}).forEach(lire);
  classementGeneral(c).forEach(r => {
    const p = r.rider_id && par[r.rider_id];
    if (!p) return;
    if (r.rank != null && !r.status) p.rang = r.rank; else if (r.status && !p.statut) p.statut = r.status;
  });
  abandons(c, c.race_type === "stage_race" ? "F" : "").forEach(r => {
    const p = par[r.rider_id];
    if (p && p.rang == null && !p.statut) p.statut = r.status;
  });
  const l = Object.values(par).map(p => ({ ...p, ref: refs[p.id] || null }));
  state.partMemo = { c, l };
  return l;
}
/** Équipes-saisons d'une saison (entites/equipes/<année>.json), mémorisées dans state.eqSaison ; 404 : {} (pas encore généré) ; autre erreur : exception, rien de mémorisé. */
async function chargerEquipesSaison(y) {
  if (state.eqSaison[y]) return state.eqSaison[y];
  try { state.eqSaison[y] = (await chargerArchive(`entites/equipes/${y}.json`)) || {}; }
  catch (e) { if (e.status === 404) state.eqSaison[y] = {}; else throw e; }
  return state.eqSaison[y];
}
/** Demande les équipes d'une saison pour construire des liens (sélection nationale, article d'équipe) ; `apres` s'exécute une fois chargées (erreur : aucun lien). */
function demanderEquipesAn(y, apres) {
  if (y == null || state.eqSaison[y] !== undefined || (state.eqDem = state.eqDem || {})[y]) return;
  state.eqDem[y] = true;
  chargerEquipesSaison(y).catch(() => { state.eqSaison[y] = {}; }).then(() => { if (apres) apres(); });
}
/** Équipes de la saison d'une fiche de course : source du caractère « sélection nationale » (règle de encyclopedie._est_nationale) et des liens vers les articles d'équipe. */
function demanderEquipes(c) {
  demanderEquipesAn(saisonCourse(c), () => {
    if (state.course !== c) return;
    const t = document.getElementById("table");
    if (t) t.innerHTML = renderTable(c, state.sel, state.sub);
    const p = document.getElementById("podium-slot"); if (p) p.innerHTML = htmlPodium(c);
  });
}
/** Équipe-saison (id, entrée) d'un libellé brut et d'une saison, SI elle existe dans equipes/<année>.json déjà chargé ; sinon null (pas de lien). */
function equipeDeLibelle(libelle, saison) {
  const id = libelle ? idEquipeSaison(libelle, saison) : null, E = state.eqSaison[saison];

  if (arch) {   // saison en cours de collecte : pas de riders.json (inutile de le demander)
    const A = await chargerArchivesIndex(), info = A && A.seasons.find(x => x.season === voulue);
    if ((info && !info.complete) || (state.archIndexes[voulue] && !state.archIndexes[voulue].complete)) return { d: null, msg: indispo };
  }
  try {
    let d;
    if (arch) d = await charger(cle);
    else {
      try { d = await charger(cle); }
      catch (e) {   // repli sur riders.json seulement pour la saison en cours
        if (voulue !== state.current) throw e;
        d = await chargerAvecRepli(`riders-${state.current}.json`, "riders.json");
      }
    }
    state.riders = d; state.ridersFor = cle;
    return { d, msg: null };
  } catch (e) {
    console.warn("Fiches coureurs indisponibles :", e.message);
    return { d: null, msg: arch && e.status === 404 ? indispo : "Fiche de la saison indisponible.", err: e };
  }
}
