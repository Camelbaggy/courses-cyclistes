/** Mini-graphique en ligne de l'évolution du rang : axe inversé (rang 1 en haut), abscisse proportionnelle au temps. pts : [[date, rang]]. */
function sparkRang(pts) {
  const W = 360, H = 150, L = 36, Rr = 14, T = 14, B = 26;
  const t = d => Date.parse(d + "T00:00:00Z");
  const xs = pts.map(p => t(p[0])), rs = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), rmax = Math.max(...rs), rmin = Math.min(...rs);
  const haut = Math.max(rmax + Math.max(2, Math.ceil(rmax * .15)), rmin + 4);
  const X = v => L + (x1 === x0 ? (W - L - Rr) / 2 : (v - x0) / (x1 - x0) * (W - L - Rr));
  const Y = r => T + (r - 1) / (haut - 1) * (H - T - B);
  const ticks = [...new Set([1, Math.round((1 + haut) / 2), Math.round(haut)])];
  const grille = ticks.map(r => `<line class="gl" x1="${L}" x2="${W - Rr}" y1="${Y(r).toFixed(1)}" y2="${Y(r).toFixed(1)}"/><text x="${L - 6}" y="${(Y(r) + 4).toFixed(1)}" text-anchor="end">${r}</text>`).join("");
  const c = pts.map((p, i) => [X(xs[i]), Y(p[1])]);
  const ligne = c.map((q, i) => `${i ? "L" : "M"}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join("");
  const aire = "";
  const dots = c.map((q, i) => `<circle class="pt${i === c.length - 1 ? " last" : ""}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i === c.length - 1 ? 4.5 : 3.5}"><title>${esc(dateLongue(pts[i][0]))} : ${esc(rang(pts[i][1]))}</title></circle>`).join("");
  const lab = `<text x="${L}" y="${H - 6}" text-anchor="start">${esc(dateCourte(pts[0][0]))} ${esc(pd(pts[0][0]).y)}</text>` +
    (pts.length > 1 ? `<text x="${W - Rr}" y="${H - 6}" text-anchor="end">${esc(dateCourte(pts[pts.length - 1][0]))} ${esc(pd(pts[pts.length - 1][0]).y)}</text>` : "");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du rang UCI : de ${esc(rang(pts[0][1]))} à ${esc(rang(pts[pts.length - 1][1]))}, meilleur ${esc(rang(rmin))}">
    <line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/>${grille}${aire}<path class="ln" d="${ligne}"/>${dots}${lab}</svg>`;
}

/** Frise des équipes : UNE liste, une ligne par équipe « Nom · 2019–2022 » (années seulement). Chaque entrée Wikidata P54 donne une ligne ; nos saisons hors de toute

function htmlParcours(cr) {
  const E = cr.ent, S = saisonsTriees(E).filter(([, s]) => s.team).slice().reverse();   // anciennes d'abord
  const nat = [], clubs = [];
  S.forEach(([y, s]) => (estSelectionNat(cr, s.team) ? nat.push({ y, ref: refEquipeSaison(s, y) }) : clubs.push({ y, team: s.team, ref: refEquipeSaison(s, y) })));
  const P54 = ((E.wikidata || {}).equipes_wd || []).filter(x => x.libelle);
  const annee = d => { const m = /^(\d{4})/.exec(d || ""); return m ? +m[1] : null; };
  const pris = new Set(), items = [];
  P54.forEach(x => {
    const a = annee(x.debut), b = annee(x.fin);
    const dedans = a != null || b != null ? clubs.filter(c => (a == null || c.y >= a) && (b == null || c.y <= b)) : [];
    dedans.forEach(c => pris.add(c.y));
    const deb = a != null ? a : dedans.length ? dedans[0].y : null;
    const fin = b != null ? b : dedans.length ? dedans[dedans.length - 1].y : deb;
    const der = dedans[dedans.length - 1], lg = cr.lg && cr.lg[x.qid];
    items.push({ nom: x.libelle, deb, fin, depuis: b == null && !dedans.length && deb != null,

  });

  });

  items.sort((x, y) => ((y.fin ?? 0) - (x.fin ?? 0)) || ((y.deb ?? 0) - (x.deb ?? 0)));

  items.forEach(it => {   // deux lignes successives de même nom : une seule
    const d = L[L.length - 1];
    if (d && normIdx(d.nom) === normIdx(it.nom)) { d.deb = Math.min(d.deb ?? it.deb, it.deb ?? d.deb); d.fin = Math.max(d.fin ?? 0, it.fin ?? 0); d.depuis = d.depuis && it.depuis; d.href = d.href || it.href; }
    else L.push({ ...it });

  const li = L.map(x => `<li><span class="nm">${x.href ? `<a class="tlink" href="${esc(x.href)}">${esc(x.nom)}</a>` : esc(x.nom)}</span><span class="an">${esc(ans(x))}</span></li>`).join("");
  const natL = nat.length ? `<div class="tbl-note">Sélection nationale : ${nat.slice().reverse().map(n => lienEquipeRef(String(n.y), n.ref, n.y)).join(", ")}</div>` : "";
  return `<div class="card"><h2 class="h-sec">Équipes</h2><ul class="eqlist">${li}</ul>${natL}</div>`;

    const m = (ys || []).length ? Math.max(...ys) : -1;
    if (!best || m > best.m || (m === best.m && nom < best.nom)) best = { nom, m };
  }

function htmlRecordsEpreuve(ep) {

    || htmlVide("Aucun record pour l'instant.");

function htmlHistoriqueEpreuve(ep) {

    main: `${tuilesEpreuve(ep)}${htmlOnglets(defs, state.etab, "etab", "etabs")}<div class="tabcontent" id="econtent" role="tabpanel"></div>

async function pageEpreuve(r, tok) {
  const main = document.getElementById("main"), cle = r.cle;
  state.ctxPage = null;
  const fil = n => htmlCrumbs([["Accueil", "#/"], ["Courses", "#courses"], ["Épreuves", "#courses/epreuves"], [n || "Épreuve"]]);
  titre("Épreuve");
  if (state.epreuveOuverte !== cle) state.etab = state.etabs[cle] || "palmares";
  state.epreuveOuverte = cle;
  if (!state.ep || state.ep.cle !== cle) {
    state.ep = null;

/* ================== article d'équipe (R2b) ================== */
/* `#equipe/<QID>[?s=<année>]` : lignée Wikidata (entites/equipes/lignees/<QID>.json) ; `#equipe/<id d'équipe-saison>` : équipe-saison sans lignée
   (entites/equipes/<année>.json) ; une équipe-saison qui a une lignée est redirigée vers `#equipe/<QID>?s=<année>`. Les deux sont ramenées à un même modèle
   { saisons: {année: {id, libelle, code_uci, effectif, victoires, grands_tours, totaux}}, annees (récentes d'abord), mouvements, … }.
   Valeur absente : ligne, tuile ou onglet absent. */
const NIVEAUX = { WT: "WorldTeam", Pro: "ProTeam", Cont: "Continentale" };
async function chargerLigneesIdx() {
  if (state.lgIdx === undefined) { try { state.lgIdx = await chargerOptionnel("entites/equipes/lignees_index.json"); } catch (e) { state.lgIdx = null; } }
  return state.lgIdx;
}
function modeleLignee(L) {
  const saisons = L.saisons || {}, annees = Object.keys(saisons).map(Number).sort((a, b) => b - a);
  return { type: "lignee", cle: L.qid, qid: L.qid, nom: L.nom || L.qid, pays: L.pays || null, paysNom: L.pays_nom || "", cats: L.cats || [], noms: L.noms || [], codes: L.codes || [],
    sitelinks: L.sitelinks || {}, logo: L.logo || null, saisons, annees, mouvements: L.mouvements || {}, tot: L.totaux_lignee || {} };
}
const effectifDe = e => (e.effectif || []).map(x => ({ rider_id: x.rider_id, n: x.name, f: x.flag, jours: x.jours, v: x.wins }));
function modeleSaison(id, y, e, prec) {
  return { type: "saison", cle: id, id, nom: e.name, pays: e.pays || null, paysNom: "", nationale: !!e.nationale, cats: [], noms: [], codes: [], sitelinks: {}, logo: null,
    saisons: { [y]: { id, libelle: e.name, code_uci: e.code_uci, effectif: effectifDe(e), victoires: e.victoires || [], grands_tours: e.grands_tours, totaux: e.totaux || {} } },
    annees: [y], mouvements: e.mouvements ? { [y]: { arrivees: e.mouvements.arrivees || [], departs: e.mouvements.departs || [], depuis: y - 1 } } : {},
    memeNom: e.meme_nom || [], tot: {}, prec: prec || [] };
}
async function chargerCoursesEquipe(eq) {
  const lettres = new Set();
  eq.annees.forEach(a => (eq.saisons[a].victoires || []).forEach(v => { if (v.course) lettres.add(lettreId(v.course)); }));
  await Promise.all([...lettres].map(chargerCoursesEnt));
}
/** Assemble l'article ; { cle, vide } si l'équipe est introuvable, { cle, redirect } pour une équipe-saison qui a une lignée. */
async function construireEquipe(r) {
  if (r.qid) {
    const [L] = await Promise.all([chargerOptionnel(`entites/equipes/lignees/${r.qid}.json`), chargerPays()]);
    if (!L || !L.saisons || !Object.keys(L.saisons).length) {
      // article de lignée pas encore publié : repli sur l'équipe-saison de la saison demandée (à défaut la plus récente) d'après lignees_index.json
      await chargerLigneesIdx();
      const ids = ((state.lgIdx || {})[r.qid] || {}).eq || [];
      const id = (r.s != null && ids.find(x => x.endsWith(`-${r.s}`))) || ids[0];
      if (!id) return { cle: r.qid, vide: true };
      return construireEquipe({ id, sansRedirection: true });
    }
    const eq = modeleLignee(L);
    await chargerCoursesEquipe(eq);
    return eq;
  }
  const y = +r.id.slice(-4);
  const [F] = await Promise.all([chargerEquipesSaison(y), chargerPays()]);
  const e = aPropre(F, r.id) ? F[r.id] : null;
  if (!e) return { cle: r.id, vide: true };
  if (e.lignee && !r.sansRedirection) {
    let L = null;
    try { L = await chargerOptionnel(`entites/equipes/lignees/${e.lignee}.json`); } catch (x) { L = null; }
    if (L && L.saisons && L.saisons[y] && L.saisons[y].id === r.id) return { cle: r.id, redirect: hrefLignee(e.lignee, y) };
  }
  let prec = [];
  if (e.mouvements) {   // noms des coureurs partis : effectif de la saison précédente
    try { const P = await chargerEquipesSaison(y - 1), k = r.id.replace(/-\d{4}$/, `-${y - 1}`); prec = aPropre(P, k) ? effectifDe(P[k]) : []; } catch (x) { prec = []; }
  }
  const eq = modeleSaison(r.id, y, e, prec);
  await chargerCoursesEquipe(eq);
  return eq;
}
/** Coureurs connus de l'article (effectifs de toutes ses saisons) : identifiant -> {n, f}. */
function coureursEquipe(eq) {
  if (!eq._c) {
    const m = new Map();
    eq.annees.forEach(a => (eq.saisons[a].effectif || []).forEach(x => { if (!m.has(x.rider_id)) m.set(x.rider_id, x); }));
    (eq.prec || []).forEach(x => { if (!m.has(x.rider_id)) m.set(x.rider_id, x); });

function tuilesEquipe(eq) {

/** Victoires des années passées à la même date (jour et mois), d'après entites/courses : éditions UCI avec vainqueur, puis palmarès Wikidata de date complète. */
async function ceJourLa() {
  const E = await chargerEpreuvesIdx();
  if (!E) return [];
  const auj = new Date(), md = `${p2(auj.getMonth() + 1)}-${p2(auj.getDate())}`, an = auj.getFullYear();
  const lettres = [...new Set(E.map(x => lettreId(x.k)))];
  const F = await Promise.all(lettres.map(chargerCoursesEnt));
  const out = [];
  F.forEach(Fl => Object.entries(Fl).forEach(([cle, C]) => {
    (C.editions || []).forEach(ed => {
      const d = ed.end_date || ed.start_date, w = (ed.podium || []).find(p => p.rank === 1);
      if (!d || !w || d.slice(5, 10) !== md || +d.slice(0, 4) >= an) return;
      noterChemin(ed);
      out.push({ an: +d.slice(0, 4), nom: nomRecent(C, cle), flag: C.flag, pays: C.pays, win: w, href: hrefCourse(ed.race_id, "") });
    });
    (C.historique || []).forEach(h => {
      const w = h.statut === "ok" && h.vainqueur ? (h.podium || []).find(p => p.rang === 1) : null;
      if (!w || !h.date || h.date.length !== 10 || h.date.slice(5) !== md || +h.date.slice(0, 4) >= an) return;
      out.push({ an: +h.date.slice(0, 4), nom: nomRecent(C, cle), flag: C.flag, pays: C.pays, win: w, href: hrefEpreuve(cle) });
    });
  }));
  return out.sort((a, b) => b.an - a.an || a.nom.localeCompare(b.nom, "fr")).slice(0, 6);
}

}
function surVisible(el, f) {

  const o = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { o.disconnect(); f(); } }, { rootMargin: "400px" });
  o.observe(el);
}

  if (tok !== state.routeTok) return;
  if (!E || !E.length) { main.innerHTML = `<div class="pg">${enteteListe("Équipes")}<div class="vide">${esc(MSG_INDEX)}</div></div>`; finPage(tok); return; }
  const ys = [...new Set(E.map(e => e.season))].sort((a, b) => b - a);
  const y = ys.includes(r.saison) ? r.saison : ys.includes(state.current) ? state.current : ys[0];
  const r2 = { ...r, saison: y };
  state.route = r2;
  titre(`Équipes ${y}`);
  state.limitListe = 100;
  const cats = ["WT", "Pro", "Cont"].filter(c => E.some(e => e.season === y && e.cat === c)).concat(E.some(e => e.season === y && e.nationale) ? ["Sélection"] : []);
  main.innerHTML = `<div class="pg">${enteteListe("Équipes", `Saison ${y}`)}
    <div class="tools">${selectHref("eq-saison", "Saison", ys.map(s => [hrefEquipes({ ...r2, saison: s, cat: "all" }), String(s), s === y]))}
      <input class="search" id="eq-q" type="search" placeholder="Rechercher une équipe" aria-label="Rechercher une équipe" value="${esc(r.q)}" autocomplete="off">
      ${chipsCat(cats, r2.cat, c => hrefEquipes({ ...r2, cat: c }))}
      ${selectHref("eq-tri", "Tri", [["nom", "Nom"], ["vic", "Victoires"], ["cou", "Coureurs"]].map(([k, l]) => [hrefEquipes({ ...r2, tri: k }), `Tri : ${l}`, r2.tri === k]))}</div>
    <div class="count-line" id="eq-count"></div><div id="eq-list"></div></div>`;
  majListeEquipes();

}

/* ================== coureurs : annuaire et Français ================== */
/** Ordre de la liste (calculé une fois par tri) : « pertinence » = actifs d'abord, puis meilleur rang UCI, puis victoires, puis nom ; « nom » = ordre du fichier (identifiant : nom de famille d'abord). */
/** Actif = présent dans la saison en cours ou la suivante (les données de la toute dernière saison, en intersaison, ne couvrent que quelques courses). */
function actif(c) { return !!(c.s && c.s[1] >= state.current); }
function ordreCoureurs(tri) {
  state.cOrd = state.cOrd || {};
  if (!state.cOrd[tri]) {
    const L = state.cIdx;
    const parUci = (a, b) => (a.uci == null) - (b.uci == null) || (a.uci ?? 0) - (b.uci ?? 0);
    if (tri === "vic") state.cOrd[tri] = L.slice().sort((a, b) => (b.v || 0) - (a.v || 0));
    else if (tri === "uci") state.cOrd[tri] = L.slice().sort(parUci);
    else if (tri === "nom") state.cOrd[tri] = L;
    else state.cOrd[tri] = L.slice().sort((a, b) => (actif(b) - actif(a)) || parUci(a, b) || (b.v || 0) - (a.v || 0));   // stable : à égalité, ordre du fichier (nom)
  }
  return state.cOrd[tri];
}
function filtrerCoureurs(r) {
  const mots = normIdx(r.q).split(" ").filter(Boolean), eq = normIdx(r.eq);
  return ordreCoureurs(r.tri).filter(c => {
    if (r.nat && c.nat !== r.nat) return false;
    if (r.act === "1" && !actif(c)) return false;
    if (r.act === "0" && actif(c)) return false;
    if (eq) { if (c._e === undefined) c._e = normIdx(c.eq || ""); if (!c._e.includes(eq)) return false; }
    if (mots.length) { if (c._n === undefined) c._n = normIdx(c.n); if (!mots.every(w => c._n.includes(w))) return false; }
    return true;
  });
}
function rowCoureur(c, tri) {
  const s = c.s || [], ys = s.length ? (s[0] === s[1] ? String(s[0]) : `${s[0]}–${s[1]}`) : "";
  const b = tri === "uci" && c.uci != null ? `UCI ${c.uci}` : c.v ? `${c.v} vic.` : "";
  const eq = c.eq ? (c.eqid ? `<a class="tlink" href="${esc(`#equipe/${c.eqid}`)}">${esc(c.eq)}</a>` : esc(c.eq)) : "";
  return `<div class="crow lk${c.fr ? " fr" : ""}">${flag(c.f, nomPays(c.nat))}
    <div><a class="nm stretch" href="${esc(hrefCoureur(c.id, null))}">${esc(c.n)}</a><div class="sm">${eq}</div></div><div class="rt">${b ? `<b>${esc(b)}</b>` : ""}${esc(ys)}</div></div>`;
}
function majListeCoureurs() {
  const box = document.getElementById("co-list"); if (!box) return;
  const r = state.route, L = filtrerCoureurs(r), vis = L.slice(0, state.limitListe);
  box.innerHTML = (vis.length ? `<div class="crows">${vis.map(c => rowCoureur(c, r.tri)).join("")}</div>` : '<div class="empty card">Aucun coureur trouvé.</div>') + pagePlus(L.length - vis.length, "co-more", 100);
  document.getElementById("co-count").textContent = `${num(L.length)} coureur${L.length > 1 ? "s" : ""}`;
}
async function pageCoureurs(r, tok) {
  const main = document.getElementById("main");
  state.ctxPage = `c${state.current}`;
  const francais = r.vue === "francais";
  titre(francais ? "Coureurs français" : "Coureurs");
  const tete = `${enteteListe("Coureurs")}<div class="subtabs clsubs">${["annuaire", "francais"].map(k =>
    `<button class="subtab ${(francais ? "francais" : "annuaire") === k ? "active" : ""}" data-cgo="${esc(hrefCoureurs({ vue: k }))}">${k === "annuaire" ? "Annuaire" : "Français"}</button>`).join("")}</div>`;
  main.innerHTML = `<div class="pg">${tete}${squeletteListe()}</div>`;
  if (francais) {
    if (state.ridersCl === undefined) state.ridersCl = await chargerRidersCourant();
    if (tok !== state.routeTok) return;
    main.innerHTML = `<div class="pg">${tete}${renderFrancais()}</div>`;
    finPage(tok);
    return;
  }
  try { await Promise.all([chargerCoureursIdx(), chargerPays()]); }
  catch (e) { if (tok === state.routeTok) main.innerHTML = `<div class="pg">${tete}${messageErreur(`Annuaire indisponible (${e.message}).`, "retry")}</div>`; return; }
  if (tok !== state.routeTok) return;
  if (!state.cIdx) { main.innerHTML = `<div class="pg">${tete}<div class="vide">${esc(MSG_INDEX)}</div></div>`; finPage(tok); return; }
  state.limitListe = 100;
  const N = new Map();
  state.cIdx = state.cIdx.filter(c => /[\p{L}\p{N}]/u.test(c.n || ""));
  state.cIdx.forEach(c => { if (c.nat) N.set(c.nat, (N.get(c.nat) || 0) + 1); });
  const nats = [...N.keys()].sort((a, b) => nomPays(a).localeCompare(nomPays(b), "fr"));
  const bascule = (cle, val) => hrefCoureurs({ ...r, [cle]: r[cle] === val ? "" : val });
  main.innerHTML = `<div class="pg">${tete}
    <div class="tools"><input class="search" id="co-q" type="search" placeholder="Rechercher un coureur" aria-label="Rechercher un coureur" value="${esc(r.q)}" autocomplete="off">
      <div class="chips">${chipHref(bascule("nat", "FRA"), "Français", r.nat === "FRA")}${chipHref(bascule("act", "1"), "Actifs", r.act === "1")}${chipHref(bascule("act", "0"), "Anciens", r.act === "0")}</div>
      <div class="two">${selectHref("co-nat", "Nationalité", [[hrefCoureurs({ ...r, nat: "" }), "Toutes nationalités", !r.nat]].concat(nats.map(n => [hrefCoureurs({ ...r, nat: n }), `${nomPays(n)} (${N.get(n)})`, r.nat === n])))}
        ${selectHref("co-tri", "Tri", [["pert", "Pertinence"], ["nom", "Nom"], ["vic", "Victoires"], ["uci", "Meilleur rang UCI"]].map(([k, l]) => [hrefCoureurs({ ...r, tri: k }), `Tri : ${l}`, r.tri === k]))}</div>
      <input class="search" id="co-eq" type="search" placeholder="Équipe (dernière saison connue)" aria-label="Filtrer par équipe" value="${esc(r.eq)}" autocomplete="off"></div>
    <div class="count-line" id="co-count"></div><div id="co-list"></div></div>`;
  majListeCoureurs();
  finPage(tok);
}

/* ================== classements : UCI (actuel, fin de saison, instantanés) et FDJ United Series ================== */
let mapCoureurs = null;
async function mapCoureursIdx() {
  if (mapCoureurs) return mapCoureurs;
  const L = await chargerCoureursIdx();
  if (!L) return null;
  mapCoureurs = new Map(L.map(c => [c.id, c]));
  return mapCoureurs;
}
/** Dernier recours pour un coureur absent de l'annuaire : l'identifiant (nom de famille, prénom, sans la date de naissance). */
function nomDepuisId(id) { return id.replace(/-\d{8}$/, "").split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" "); }
async function donneesUci(r) {   // { titre, rows, ids, selecteurs } pour la saison et la date de la route
  const A = state.archIdx, info = A && (A.seasons || []).find(s => s.season === r.saison);
  if (r.saison == null) {
    const R = await chargerRanking();
    if (state.ridersCl === undefined) state.ridersCl = await chargerRidersCourant();
    if (!R || !(R.rows || []).length) return { vide: "Classement UCI indisponible." };
    return { titre: `${R.name || "Classement UCI"}${R.date ? ` · au ${dateLongue(R.date)}` : ""}`, rows: R.rows, ids: (state.ridersCl && state.ridersCl.riders) || {} };
  }
  const y = r.saison, I = await chargerEntIdx();
  const S = I && (I.saisons || []).includes(y) ? await chargerOptionnel(`entites/saisons/${y}.json`) : null;
  const insts = ((S && S.instantanes_uci) || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const fin = info && info.complete ? await chargerOptionnel(`${y}/ranking.json`) : null;
  const dates = (fin && (fin.rows || []).length ? [["fin", `Fin de saison${fin.date ? ` (${dateLongue(fin.date)})` : ""}`]] : [])
    .concat(insts.map(x => [x.date, `${dateLongue(x.date)}${(x.raisons || []).length ? " · " + x.raisons.join(", ") : ""}`]));
  if (!dates.length) return { vide: `Aucun classement UCI disponible pour la saison ${y}.`, dates: [] };
  const date = dates.some(d => d[0] === r.date) ? r.date : dates[0][0];
  if (date === "fin") return { titre: `${fin.name || "Classement UCI"} · fin de saison ${y}`, rows: fin.rows, ids: null, dates, date };
  const [D, M] = await Promise.all([chargerArchive(`entites/classements/${y}/${date}.json`), mapCoureursIdx().catch(() => null)]);
  const rows = (D.lignes || []).map(([rk, id, pts, tc]) => {
    const c = M && id ? M.get(id) : null;
    return { rank: rk, rider_id: id, name: c ? c.n : id ? nomDepuisId(id) : "Coureur inconnu", nationality: c ? c.nat : null, team: tc || "", points: pts, previous_rank: null };
  });
  return { titre: `${D.nom || "Classement UCI"} · au ${dateLongue(D.date || date)}`, rows, ids: id => !!(M && M.has(id)), dates, date };
}
async function pageClassements(r, tok) {
  const main = document.getElementById("main");
  state.ctxPage = null;
  const fdj = r.sub === "fdj";
  titre(fdj ? "Classement FDJ United Series" : "Classement UCI");
  const bar = `<div class="subtabs clsubs"><a class="subtab ${!fdj ? "active" : ""}" href="#classements/uci">UCI</a><a class="subtab ${fdj ? "active" : ""}" href="#classements/fdj">FDJ United Series</a></div>`;
  const tete = enteteListe("Classements");
  if (fdj) { main.innerHTML = `<div class="pg">${tete}${bar}${renderFdj()}</div>`; finPage(tok); return; }
  main.innerHTML = `<div class="pg">${tete}${bar}${squeletteListe()}</div>`;
  await chargerArchivesIndex();
  let D;
  try { D = await donneesUci(r); }
  catch (e) { if (tok === state.routeTok) main.innerHTML = `<div class="pg">${tete}${bar}${messageErreur(`Classement indisponible (${e.message}).`, "retry")}</div>`; return; }
  if (tok !== state.routeTok) return;
  const ys = listeSaisons().map(s => s.y);
  const sels = [selectHref("cl-saison", "Saison", [[hrefClassements({ sub: "uci" }), "Classement actuel", r.saison == null]].concat(ys.map(y => [hrefClassements({ sub: "uci", saison: y }), `Saison ${y}`, r.saison === y])))];
  if (D.dates && D.dates.length) sels.push(selectHref("cl-date", "Date du classement", D.dates.map(([d, l]) => [hrefClassements({ sub: "uci", saison: r.saison, date: d }), l, d === D.date])));
  state.uc.limit = 100;
  state.clVue = D.vide ? null : { rows: D.rows, ids: D.ids };
  main.innerHTML = `<div class="pg">${tete}${bar}<div class="tools">${sels.join("")}</div>${D.vide ? `<div class="vide">${esc(D.vide)}</div>` : blocUci(D.titre)}</div>`;
  if (!D.vide) majListeUci();
  finPage(tok);
}

/* ================== recherche globale (page) ================== */
async function pageRecherche(r, tok) {
  const main = document.getElementById("main"), S = state.sr;

    <input class="search sr-input" id="sr-q" type="search" placeholder="Coureur, équipe, course…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Rechercher" role="combobox" aria-expanded="true" aria-controls="sr-body" value="${esc(r.q)}">
    <div class="sr-body" id="sr-body" role="listbox" aria-label="Résultats"></div></div>`;

/* ================== événements (délégation) ================== */
document.addEventListener("click", e => {
  const lien = e.target.closest("[data-rider]");
  if (lien) { e.preventDefault(); go(hrefCoureur(lien.dataset.rider, lien.dataset.rctx || state.ctxPage)); return; }
  const t = e.target.closest("button, [data-open]");
  if (!t) return;
  if (t.dataset.cgo) { remplacer(t.dataset.cgo); return; }
  if (t.dataset.rtab) { choisirOngletCoureur(t.dataset.rtab); return; }
  if (t.dataset.etab) { choisirOngletEpreuve(t.dataset.etab); return; }
  if (t.dataset.qtab) { choisirOngletEquipe(t.dataset.qtab); return; }
  if (t.dataset.epreuve) { go(hrefEpreuve(t.dataset.epreuve)); return; }
  if (t.dataset.pcat) { state.rpal.cat = t.dataset.pcat; majContenuCoureur(); return; }
  if (t.dataset.sr) { choisirResultat(t); return; }
  if (t.dataset.open) { state.subVoulu = t.dataset.vsub || null; go(hrefCourse(t.dataset.open, t.dataset.stage)); return; }
  if (t.dataset.stageSel != null && t.dataset.stageSel !== "") {
    state.sel = t.dataset.stageSel; state.limit = 50; setHashEtape(state.sel); renderFiche(); return;
  }
  if (t.dataset.sub) { state.sub = t.dataset.sub; state.limit = 50; renderFiche(); return; }
  const a = t.dataset.action;
  if (a === "fronly") { state.frOnly = !state.frOnly; renderFiche(); }
  else if (a === "part-tous") { state.partTous = !state.partTous; state.partOuv = {}; renderFiche(); }
  else if (a === "part-eq") { const k = t.dataset.eq, o = t.getAttribute("aria-expanded") === "true"; state.partOuv[k] = !o; if (o && state.partTous) { state.partTous = false; document.querySelectorAll('[data-action="part-eq"][aria-expanded="true"]').forEach(b => { if (b !== t) state.partOuv[b.dataset.eq] = true; }); const s = document.querySelector('[data-action="part-tous"]'); if (s) s.setAttribute("aria-pressed", "false"); } document.getElementById("table").innerHTML = renderTable(state.course, state.sel, state.sub); }
  else if (a === "more") { state.limit += 50; document.getElementById("table").innerHTML = renderTable(state.course, state.sel, state.sub); }
  else if (a === "uc-more") { state.uc.limit += 100; majListeUci(); }
  else if (a === "uc-fr") { state.uc.fr = !state.uc.fr; state.uc.limit = 100; t.setAttribute("aria-pressed", state.uc.fr); majListeUci(); }
  else if (a === "co-more") { state.limitListe += 100; majListeCoureurs(); }
  else if (a === "ep-more") { state.limitListe += 100; majListeEpreuves(); }
  else if (a === "eq-more") { state.limitListe += 100; majListeEquipes(); }
  else if (a === "retry") { routeur({ garder: true }); }
  else if (a === "search") { if (state.route && state.route.nom === "recherche") document.getElementById("sr-q").focus(); else go("#recherche"); }
  else if (a === "sr-more") { state.sr.tout[t.dataset.grp] = true; document.getElementById("sr-body").innerHTML = htmlResultats(); }
  else if (a === "retry-sr") { cache.clear(); majRecherche(); }
  else if (a === "pal-vic") { state.rpal.vic = !state.rpal.vic; majContenuCoureur(); }
  else if (a === "retry-index") { cache.clear(); init(); }
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.hsel != null) remplacer(e.target.value); });
/** Champ de texte d'une page de liste : met à jour la route (sans historique) et la liste, sans redessiner le champ. */
function saisie(champ, maj) {
  const r = state.route, h = { "co-q": ["q", hrefCoureurs], "co-eq": ["eq", hrefCoureurs], "ep-q": ["q", hrefCourses], "eq-q": ["q", hrefEquipes] }[champ.id];
  if (!h) return false;
  r[h[0]] = champ.value;
  history.replaceState(history.state, "", h[1](r));
  state.limitListe = 100;
  ({ "co-q": majListeCoureurs, "co-eq": majListeCoureurs, "ep-q": majListeEpreuves, "eq-q": majListeEquipes })[champ.id]();
  return true;
}
document.addEventListener("input", e => {
  if (e.target.id === "sr-q") {
    state.sr.q = e.target.value;
    const q = state.sr.q.trim();
    history.replaceState(history.state, "", "#recherche" + (q ? "/" + encodeURIComponent(q) : ""));
    titre(q ? `Recherche : ${q}` : "Recherche");
    majRecherche(); return;
  }
  if (e.target.id === "uc-q") { state.uc.q = e.target.value; state.uc.limit = 100; majListeUci(); return; }
  saisie(e.target);
});
document.addEventListener("keydown", e => {
  if (e.target && e.target.id === "sr-q") {
    if (e.key === "ArrowDown") { e.preventDefault(); selectionnerResultat(state.sr.sel + 1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); selectionnerResultat(state.sr.sel < 0 ? -1 : state.sr.sel - 1); return; }
    if (e.key === "Enter") { e.preventDefault(); const L = itemsNav(); choisirResultat(L[state.sr.sel >= 0 ? state.sr.sel : 0]); return; }
  }
  const lien = e.target.closest && e.target.closest("[data-rider]");
  if (lien && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(hrefCoureur(lien.dataset.rider, lien.dataset.rctx || state.ctxPage)); }
});
window.addEventListener("scroll", () => { const k = history.state && history.state.k; if (k != null) scrollMemo.set(k, window.scrollY); }, { passive: true });

/* ================== démarrage ================== */
async function chargerAvecRepli(chemin, repli) {
  try { return await charger(chemin); } catch (e) { if (!repli) throw e; return await charger(repli); }
}
async function chargerIndex(saison) {
  const S = state.saisons;
  if (!S) return charger("index.json");
  return chargerAvecRepli(`index-${saison}.json`, saison === S.current ? "index.json" : null);
}
/** Anciennes adresses : ?archive=2023 et ?saison=2026 (onglets Archives et Calendrier) deviennent #courses/<année>. */
function redirigerAncienneUrl() {
  const u = new URL(location.href);
  if (!u.searchParams.has("archive") && !u.searchParams.has("saison")) return;
  const an = parseInt(u.searchParams.get("archive") || u.searchParams.get("saison"), 10);
  u.searchParams.delete("archive"); u.searchParams.delete("saison");
  if ((!u.hash || u.hash === "#") && an) u.hash = `#courses/${an}`;
  history.replaceState(null, "", u.pathname + u.search + u.hash);
}
let ecouteurs = false;
async function init() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">Chargement…</div>`;
  try {
    try { state.saisons = await charger("seasons.json"); } catch (e) { state.saisons = null; }
    const S = state.saisons;
    if (S && Array.isArray(S.available) && S.available.length) {
      state.current = S.available.includes(S.current) ? S.current : S.available[0];
    } else state.saisons = null;
    state.index = await chargerIndex(state.current);
  } catch (e) {
    console.error("Chargement de l'index échoué :", e);
    main.innerHTML = messageErreur(`Impossible de charger les données (${e.message}).`, "retry-index");
    return;
  }
  const ix = state.index;
  if (!state.saisons) { state.current = ix.season ?? null; state.saisons = { current: state.current, available: [state.current] }; }
  state.indexes[state.current] = ix;
  if (ix._fixture) document.getElementById("banner").innerHTML = '<div class="fixture-banner">DONNÉES FICTIVES DE TEST</div>';
  const g = ix.generated_at ? new Date(ix.generated_at) : null;
  if (g && !isNaN(g)) {
    document.getElementById("maj").textContent = `MàJ ${g.getDate()} ${MOIS_C[g.getMonth()]} ${p2(g.getHours())}h${p2(g.getMinutes())}`;
  }
  document.getElementById("foot").textContent = "Résultats et classement : UCI, ASO, LNC · calendrier à venir : Wikipédia (CC BY-SA)";
  redirigerAncienneUrl();
  if (!ecouteurs) {
    ecouteurs = true;
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.addEventListener("hashchange", () => routeur());
  }
  routeur();
}
init();
